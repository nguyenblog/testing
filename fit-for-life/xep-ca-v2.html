<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fit For Life — Máy xếp ca v2 (demo)</title>
<style>
:root{
  --bg:#fffdf7; --soft:#f8f3e5; --ink:#1f1c16; --muted:#6b6557; --faint:#9a927f; --line:#ece5d2;
  --accent:#0f8a70; --warn:#b7791f; --bad:#c0392b;
  --accent-soft:color-mix(in srgb,var(--accent) 10%,var(--bg));
  --warn-soft:color-mix(in srgb,var(--warn) 14%,var(--bg));
  --bad-soft:color-mix(in srgb,var(--bad) 10%,var(--bg));
  --free:color-mix(in srgb,var(--ink) 55%,var(--bg));
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16150f; --soft:#1d1b14; --ink:#eee9d8; --muted:#a29b88; --faint:#71695a; --line:#2b281d;
  --accent:#22a086; --warn:#e0b04a; --bad:#f08070;}}
:root[data-theme="dark"]{
  --bg:#16150f; --soft:#1d1b14; --ink:#eee9d8; --muted:#a29b88; --faint:#71695a; --line:#2b281d;
  --accent:#22a086; --warn:#e0b04a; --bad:#f08070;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1480px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;display:flex;gap:8px;align-items:center}
h3{font-size:14px;font-weight:600;margin:0 0 8px}
p{margin:6px 0} b{font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)} small{font-size:12.5px}
.top{display:flex;gap:12px 24px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.top .meta{color:var(--muted);font-size:13.5px}
/* thanh bước */
.steps{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
.steps button{font:inherit;font-size:14.5px;font-weight:500;height:44px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px;display:flex;gap:8px;align-items:center;transition:color .12s,border-color .12s}
.steps button:hover{color:var(--ink)}
.steps button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.steps .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600}
.steps button[aria-selected="true"] .no{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps .sp{color:var(--faint);align-self:center}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fade{animation:fd .2s var(--ease)}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}*{transition:none!important}}
/* nút */
.b{font:inherit;font-size:14px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.b:hover{background:var(--soft);border-color:var(--faint)}
.b:active{transform:translateY(1px)}
.b.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.b.pri:hover{background:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.b:disabled{opacity:.4;cursor:default}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:20px}
.acts .r{margin-left:auto}
@media(max-width:600px){.acts .b{white-space:normal;height:auto;min-height:36px;padding:6px 14px;text-align:left}}
/* chip */
.chip{display:inline-block;font-size:12px;font-weight:500;border-radius:999px;padding:1px 9px;white-space:nowrap;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.chip.w{background:var(--warn-soft);color:color-mix(in srgb,var(--warn) 65%,var(--ink));border-color:transparent;font-weight:600}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}
/* bước 1 */
.cols2{display:grid;grid-template-columns:5fr 3fr;gap:24px}
.cols2>section{min-width:0}
@media(max-width:1000px){.cols2{grid-template-columns:1fr}}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);min-width:0}
.card .nm{font-weight:600;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .chips{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin-bottom:10px}
.kv span:nth-child(odd){color:var(--muted)}
.mg{display:grid;grid-template-columns:22px repeat(7,1fr);gap:1px;font-size:10px;line-height:1;max-width:210px}
.mg .d{text-align:center;color:var(--muted);padding-bottom:3px}
.mg .h{color:var(--faint);text-align:right;padding-right:4px;font-variant-numeric:tabular-nums;height:8px;overflow:visible}
.mg i{height:8px;border-radius:2px;background:var(--line)}
.mg i.on{background:var(--free)}
.mg i.s{background:var(--accent)}
.cap{font-size:12px;color:var(--muted);margin-top:6px}
/* bước 2 */
.rg{border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
.rg>.hd{background:var(--soft);padding:10px 14px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rg>.hd small{font-weight:400;color:var(--muted)}
.rr{display:grid;grid-template-columns:52px minmax(0,3fr) minmax(0,2fr) auto;gap:8px 14px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.rr.u{grid-template-columns:52px 66px minmax(0,3fr) minmax(0,2fr) auto}
.rr.off .tx,.rr.off .pm{opacity:.45}
.rr .tx b{display:block;font-size:14.5px}
.rr .tx span{font-size:13px;color:var(--muted)}
.rr .tx code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--faint);margin-left:6px;font-weight:400}
.rr .pm{font-size:13px;color:var(--muted)}
@media(max-width:820px){.rr,.rr.u{grid-template-columns:52px 1fr}.rr .pm,.rr .sr{grid-column:2}.rr.u .mv{grid-column:2}}
.sw{width:40px;height:22px;border-radius:999px;border:1px solid var(--line);background:var(--soft);position:relative;cursor:pointer;transition:background .12s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--faint);transition:transform .12s var(--ease),background .12s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.sw:disabled{opacity:.5;cursor:default}
.mv{display:flex;gap:4px}
.mv button{font:inherit;width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.mv button:hover{background:var(--soft)} .mv button:disabled{opacity:.3;cursor:default}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0}
.note.w{border-color:var(--warn)}
/* bước 3 */
.kpi{display:flex;gap:8px 24px;flex-wrap:wrap;margin-bottom:14px}
.kpi div{font-size:13px;color:var(--muted)} .kpi b{font-size:22px;color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}
.kpi .w b{color:var(--warn)} .kpi .bd b{color:var(--bad)}
.l3{display:grid;grid-template-columns:210px minmax(0,1fr) 320px;gap:16px;align-items:start}
.l3>div{min-width:0}
@media(max-width:1180px){.l3{grid-template-columns:1fr}}
.rail .it{display:block;width:100%;text-align:left;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px 10px;margin-bottom:6px;cursor:pointer;transition:background .12s,border-color .12s}
.rail .it:hover{background:var(--soft)}
.rail .it.sel{border-color:var(--accent);background:var(--accent-soft)}
.rail .it b{font-size:14px;display:block}
.rail .it span{font-size:12.5px;color:var(--muted)}
.cal{border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.cg{display:grid;grid-template-columns:44px repeat(7,minmax(112px,1fr));min-width:830px}
.cg .dh{font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 6px;text-align:center;background:var(--soft);border-bottom:1px solid var(--line)}
.cg .hh{font-size:11.5px;color:var(--faint);text-align:right;padding:3px 6px 0 0;font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
.cg .ce{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:3px;min-height:18px;display:flex;flex-direction:column;gap:3px}
.cg .brk{grid-column:1/-1;font-size:11.5px;color:var(--faint);text-align:center;padding:3px;border-top:1px solid var(--line);background:var(--soft)}
.ss{font:inherit;text-align:left;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--bg));background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:5px 7px;cursor:pointer;width:100%;transition:opacity .12s,box-shadow .12s}
.ss:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.ss .pt{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted)}
.ss .bk{display:block;font-size:13px;font-weight:600;line-height:1.3;margin-top:2px}
.ss .bk em{display:block;font-style:normal;font-weight:400;font-size:11.5px;color:var(--accent)}
.ss.tmp{border:1px dashed var(--warn);background:var(--warn-soft)}
.ss.tmp .bk em.t{color:color-mix(in srgb,var(--warn) 65%,var(--ink))}
.ss.chg{box-shadow:inset 0 0 0 2px var(--ink)}
.ss.dim{opacity:.25}
.ss.sel{box-shadow:0 0 0 2px var(--ink)}
.lg{font-size:12.5px;color:var(--muted);display:flex;gap:6px 16px;flex-wrap:wrap;margin:8px 0 0}
.lg i{display:inline-block;width:22px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--bg));background:var(--accent-soft)}
.lg i.t{border:1px dashed var(--warn);background:var(--warn-soft)}
.lg i.c{box-shadow:inset 0 0 0 2px var(--ink)}
.side .box{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--bg)}
.side .box.dt{border-color:var(--ink)}
.side .x{float:right;font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px}
.side .x:hover{color:var(--ink)}
.todo{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;background:var(--bg);padding:8px 10px;margin-bottom:8px;cursor:pointer;transition:background .12s}
.todo.un{border-left-color:var(--bad)}
.todo:hover{background:var(--soft)}
.todo b{font-size:13.5px;display:block}
.todo span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.todo span.hint{color:var(--ink)}
ol.tr{padding-left:20px;font-size:13px;margin:6px 0} ol.tr li{margin:4px 0}
ol.tr li.na{color:var(--faint)}
.fl{font-size:13px;border-left:3px solid var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:0 8px 8px 0;margin:6px 0}
.fl small{display:block;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
table.mt tr[data-met]:hover td,table.mt tr.sel td{background:var(--soft)}
.todo:disabled{cursor:default}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.below{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:20px}
.below>div{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.used{display:flex;gap:4px;flex-wrap:wrap}
.used .chip.off{text-decoration:line-through;opacity:.55}
.banner{border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px;background:var(--soft)}

/* tab Hệ thống chạy */
.sys{display:grid;gap:28px}
.sys section{min-width:0}
.sys .lead{max-width:760px;color:var(--muted);font-size:14px;margin:4px 0 0}
.dg{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-top:12px}
.dg svg{display:block;width:100%;min-width:1000px;height:auto;color:var(--ink)}
.dg .bx{fill:var(--bg);stroke:var(--faint)}
.dg .bx.k{fill:var(--accent-soft);stroke:var(--accent)}
.dg .bx.w{fill:var(--warn-soft);stroke:var(--warn)}
.dg .lp{fill:none;stroke:var(--faint);stroke-dasharray:5 4}
.dg .ar{stroke:var(--muted);fill:none;stroke-width:1.4}
.dg text{fill:var(--ink);font-size:12.5px;font-family:inherit}
.dg text.t{font-weight:600;font-size:13px}
.dg text.s{fill:var(--muted);font-size:11.5px}
.dg text.l{fill:var(--muted);font-size:11px}
.dg .ah{fill:var(--muted)}
figcaption{font-size:13px;color:var(--muted);margin-top:8px;max-width:820px}
.sch{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;margin-top:12px}
.sch>div{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.sch h3 small{font-weight:400;color:var(--muted);margin-left:6px}
td code,.sys code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
td.ex{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
ol.alg{padding-left:22px;max-width:820px;font-size:14px} ol.alg li{margin:8px 0} ol.alg li small{display:block;color:var(--muted);font-size:13px}
.steps .tabx{margin-left:auto}
/* nhập dữ liệu */
.inp{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:20px;background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--soft);flex-wrap:wrap;margin-bottom:8px}
.seg button{font:inherit;font-size:14px;border:0;border-radius:7px;padding:6px 12px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 15%,transparent)}
.inp .row,.box .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.ta{margin-top:14px;min-width:0}
.tah{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.b.sm{height:28px;font-size:12.5px;padding:0 10px}
textarea{width:100%;font:12.5px/1.5 ui-monospace,Consolas,monospace;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre;overflow:auto;resize:vertical;tab-size:4}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
input.b{cursor:text}
.errs{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:13.5px}
.errs ul{margin:6px 0 0 18px}
th.hd,td.hd{border-left:2px solid var(--line)}
.bars{display:grid;gap:6px;font-size:13px}
.br{display:grid;grid-template-columns:minmax(0,11em) 1fr 2.5em;gap:8px;align-items:center}
.br span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br i{display:block;height:10px;border-radius:3px;background:var(--accent);width:var(--w);min-width:2px}
.br b{text-align:right;font-variant-numeric:tabular-nums}
table.ros td.over{color:var(--bad);font-weight:600;background:var(--bad-soft)}
.mg i{height:4px}.mg .h{height:4px}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0 4px}
.tl div{border-top:3px solid var(--accent);padding:6px 2px 0;font-size:13px}
.tl b{display:block;font-size:13.5px}.tl span{color:var(--muted)}
.phones{display:flex;gap:20px;flex-wrap:wrap;margin-top:8px}
.phone{width:100%;max-width:340px;border:1px solid var(--line);border-radius:24px;padding:18px 16px;background:var(--soft);font-size:13.5px}
.phone .ph{font-weight:600;font-size:15px;margin-bottom:12px}
.fld{margin-bottom:12px}.fld>label{display:block;font-weight:500;margin-bottom:5px}.fld small{color:var(--muted);font-weight:400}
.rq{color:var(--bad)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}.inp.ph2{color:var(--faint)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.op{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:12.5px}
.op.on{background:var(--accent);border-color:var(--accent);color:#fff}
.win{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;margin-bottom:5px;font-variant-numeric:tabular-nums}
.add{font-size:12.5px;color:var(--accent)}
.fgrid{display:grid;grid-template-columns:38px repeat(7,1fr);gap:2px;font-size:11px}
.fgrid .d{text-align:center;color:var(--muted)}.fgrid .h{color:var(--faint);text-align:right;padding-right:4px}
.fgrid i{height:16px;border-radius:3px;background:var(--bg);border:1px solid var(--line)}.fgrid i.on{background:var(--accent);border-color:var(--accent)}
.sumr{font-size:13px;margin:4px 0 12px}
.btn{background:var(--ink);color:var(--bg);text-align:center;border-radius:10px;padding:9px;font-weight:600}
.theme{position:fixed;bottom:12px;right:12px;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;z-index:6}
.theme:hover{color:var(--ink)}
</style>
</head>
<body>
<button class="theme" onclick="var r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark'">Sáng / Tối</button>
<div class="wrap">
  <div class="top">
    <div><h1>Máy xếp ca v2</h1><div class="meta" id="meta"></div></div>
  </div>
  <nav class="steps" id="steps" role="tablist"></nav>
  <main id="app"></main>
</div>

<script>
/*ENGINE-START*/
/* ===== Máy xếp ca v2. Thiết kế: fit-for-life/may-xep-ca-v2-thiet-ke.md ===== */
let DAYS;
function setWeek(mon){const t=new Date(mon+'T00:00:00Z');DAYS=[...Array(7)].map((_,i)=>new Date(t.getTime()+i*864e5).toISOString().slice(0,10))}
setWeek('2026-10-05');
const weekLabel=()=>`${dm(0)} – ${dm(6)}/${DAYS[6].slice(0,4)}`;
const DOWS=['T2','T3','T4','T5','T6','T7','CN'];
// Thời gian tính bằng phút từ 0h. Buổi dài DUR phút, bắt đầu mỗi STEP phút từ 6:00 đến 20:00.
const DUR=60,STEP=30,OPEN=360,LAST=1200;
const START=[];for(let t=OPEN;t<=LAST;t+=STEP)START.push(t);
const hm=t=>`${Math.floor(t/60)}h${t%60?String(t%60).padStart(2,'0'):''}`;
const hmc=t=>t%60?`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`:String(t/60);
const dm=i=>{const[,m,d]=DAYS[i].split('-').map(Number);return d+'/'+m};
const K=(d,h)=>d+'|'+h;
const slotT=(d,h)=>`${DOWS[d]} ${dm(d)} · ${hm(h)}–${hm(h+DUR)}`;
const slotS=(d,h)=>`${DOWS[d]} ${hm(h)}`;
const CT={ft:'Full-time',pt:'Part-time',oc:'Theo ca'};

function runsOk(hs,p){

  hs.forEach(h=>{const r=runs[runs.length-1];if(r&&r[1]===h)r[1]=h+DUR;else runs.push([h,h+DUR])});
  for(let i=0;i<runs.length;i++){const len=(runs[i][1]-runs[i][0])/DUR;if(len>p.runMax)return false;
    if(i>0){const pl=(runs[i-1][1]-runs[i-1][0])/DUR;if(pl>=p.runMax&&runs[i][0]-runs[i-1][1]<p.rest*60)return false}}
  return true;
}
// Trả {ok,join} hoặc {no: mã rule đầu tiên chặn, blocker}
function check(c,d,h,p,o={}){
  if(!p.kinds.includes(c.kind))return{no:'N1'};
  if(!(o.av||c.av).has(K(d,h)))return{no:'N2'};
  if(!p.av.has(K(d,h)))return{no:'N3'};
  const wk=p.avk&&p.avk.get(K(d,h));if(wk&&!wk.includes(c.kind))return{no:'N3'};
  const lap=x=>x.id!==o.ignore&&x.d===d&&Math.abs(x.h-h)<DUR;
  if(SESS.some(x=>lap(x)&&x.bk.some(b=>b.c===c.id)))return{no:'N4'};
  let s=SESS.find(x=>x.p===p.id&&x.d===d&&x.h===h);if(s&&s.id===o.ignore)s=null;
  let join=null;
  if(s){if(c.cls==='1-2'&&s.cls==='1-2'&&s.kind===c.kind&&s.bk.length<2)join=s;else return{no:'N4',blocker:s}}
  if(SESS.some(x=>lap(x)&&x.p===p.id&&x.h!==h))return{no:'N4'};
  if(on('G1')&&SESS.some(x=>x.id!==o.ignore&&x.d===d&&x.bk.some(b=>b.c===c.id)))return{no:'G1'};
  if(!join){
    const hs=SESS.filter(x=>x.p===p.id&&x.d===d&&x.id!==o.ignore).map(x=>x.h);
    if(on('G2')&&hs.length+1>p.dayMax)return{no:'G2'};
    if(on('G3')&&p.monthMax!=null&&p.done+weekCount(p)+1>p.monthMax)return{no:'G3'};
    if(on('G4')&&!runsOk(hs.concat(h),p))return{no:'G4'};
  }

}
function options(c,count){

  const keys=[...c.av].map(k=>k.split('|').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  for(const[d,h]of keys)for(const p of PTS){
    const r=check(c,d,h,p);
    if(r.ok){cands.push({d,h,p,join:r.join});base++;bpts.add(p.id);continue}
    if(r.no[0]==='G'){cut[r.no]=(cut[r.no]||0)+1;base++;bpts.add(p.id)}
    if(r.no==='N4'&&r.blocker&&check(c,d,h,p,{ignore:r.blocker.id}).ok)blk.push({d,h,p,s:r.blocker});

const ptsOf=set=>[...new Set(set.map(x=>x.p.id))];

const VAL={

  U2:c=>c.issue?x=>x.p.spec.includes(c.issue)?1:0:null,
  U4:c=>c.cls==='1-2'?x=>x.join?1:0:null,

const BIN={U3:1,U2:1,U4:1,U6:1};
function narrow(c,cands){
  const steps=[];let set=cands,decide=null;const start=ptsOf(cands);
  for(const id of UORD){if(id==='U1'||!on(id))continue;
    const val=VAL[id](c);if(!val){steps.push({id,na:true});continue}
    const vs=set.map(val),best=Math.max(...vs);
    if(BIN[id]&&best===0){steps.push({id,none:true});continue}
    const nxt=set.filter((x,i)=>vs[i]===best),before=ptsOf(set),after=ptsOf(nxt);
    steps.push({id,cut:set.length-nxt.length,kept:after,dropped:before.filter(p=>!after.includes(p))});
    if(before.length>1&&after.length===1&&!decide)decide=id;
    set=nxt;
  }
  set=set.slice().sort((a,b)=>a.d-b.d||a.h-b.h||PTS.indexOf(a.p)-PTS.indexOf(b.p));
  if(!decide)decide=start.length===1?'ONE':'TIE';
  return{win:set[0],steps,decide,left:ptsOf(set)};
}
function book(c,x,bk){

  s.bk.push({c:c.id,flags:[],...bk});return s;
}
// Cờ về độ khớp PT. Dùng cho cả ca mới lẫn ca bị dời.
function fitFlags(c,p,cands,viaPref,steps){
  const f=[];
  if(c.issue&&on('U2')&&!p.spec.includes(c.issue)){
    const sp=cands?cands.filter(x=>x.p.spec.includes(c.issue)):[];
    if(viaPref)f.push({code:'T3',text:`Khách chọn PT ${p.short}, nhưng PT ${p.short} không chuyên ${c.issue}. Máy vẫn xếp theo ý khách.`});
    else if(!sp.length)f.push({code:'T3',text:`Không có PT chuyên ${c.issue} nhận được ô nào khách rảnh.`});
    else{
      // Có PT đúng chuyên môn nhận được, nhưng bị rule ưu tiên xếp trên loại trước.
      const x=sp[0],st=(steps||[]).find(s=>s.dropped&&s.dropped.includes(x.p.id));
      f.push({code:'T3',text:`PT ${x.p.short} chuyên ${c.issue} nhận được ${c.short}, nhưng bị loại vì rule "${st?RB[st.id].name:'ưu tiên khác'}" xếp trên "Chuyên môn". Máy xếp PT ${p.short}, không chuyên ${c.issue}.`,
        hint:`CS cân nhắc đổi sang PT ${x.p.short} ở ô ${slotS(x.d,x.h)}${st&&st.id==='U3'?` (PT ${x.p.short} hợp lớp ${x.p.fit.join(', ')}, gói của khách là ${c.cls})`:''}.`});
    }
  }
  if(on('U3')&&!p.fit.includes(c.cls))f.push({code:'T4',text:`PT ${p.short} hợp dạy lớp ${p.fit.join(', ')}, không hợp lớp ${c.cls}. Không khuyến nghị.`});
  if(p.ct==='oc')f.push({code:'T6',text:`Phải dùng PT theo ca.`});

}
// Ô khác mà khách k (đang ở ca s) và PT p cùng nhận được: gợi ý cho CS hỏi đổi ca.
function altFor(k,s,p){
  const c=CB[k.c],out=[];

    const r=check(c,d,h,p,{ignore:s.id});if(r.ok&&!r.join)out.push({d,h})}
  return out.sort((a,b)=>Math.abs(a.d-s.d)-Math.abs(b.d-s.d)||a.d-b.d||a.h-b.h);

// Dời cả ca s sang PT khác cùng giờ để nhường ô cho khách forC.
function tryMove(s,forC){

  const qs=PTS.filter(q=>q!==p0&&cs.every(c=>{const r=check(c,s.d,s.h,q,{ignore:s.id});return r.ok&&!r.join}));
  if(!qs.length)return null;
  const q=narrow(cs[0],qs.map(q=>({d:s.d,h:s.h,p:q,join:null}))).win.p;
  s.p=q.id;
  s.bk.forEach(b=>{const c=CB[b.c];
    b.moved={from:p0.id,to:q.id,for:forC.id};
    b.flags=b.flags.filter(f=>!['T3','T4','T6','HD'].includes(f.code));
    const ff=fitFlags(c,q,null,false).filter(f=>f.code!=='T3');
    if(c.issue&&on('U2')&&p0.spec.includes(c.issue)&&!q.spec.includes(c.issue))ff.unshift({code:'T3',text:`Sau khi dời, ${c.short} không còn PT chuyên ${c.issue}.`});

  });

}

  const o=options(c);

function placeOne(c){

const THR_YEAR=2026;

const cleanBullet=l=>l.replace(/^[\s*•\-–·]+/,'').trim();

function parseNames(t){

// "Pilates 1-4 A + B + () - HLV @X => Pilates 1-4 B + () + ()"
function parseSessLine(line){

  const[,dow,dd,mm,hh,mi,rest0]=m;
  const[before,after]=rest0.split('=>').map(x=>x&&x.trim());

}
function splitMsgs(text){
  const L=text.normalize('NFC').split(/\r?\n/);const msgs=[];let cur=null;
  for(let i=0;i<L.length;i++){

      if(cur){for(let j=cur.lines.length-1;j>=0;j--){if(cur.lines[j].trim()){author=cur.lines.splice(j,1)[0].trim();break}}}
      else{for(let j=i-1;j>=0;j--)if(L[j].trim()){author=L[j].trim();break}}
      let hr=+h[3]%12+(h[5].toUpperCase()==='PM'?12:0);
      cur={author,at:new Date(Date.UTC(THR_YEAR,MON[h[1].toLowerCase()]-1,+h[2],hr,+h[4])),lines:[]};msgs.push(cur);continue;

function readThread(text){

    const isCancel=body.some(l=>/^b[áa]o\s+h(uỷ|ủy|uy)/i.test(l));

    const close=()=>{if(sess&&isCancel){(explicit?recs.filter(r=>r.explicit):recs).forEach(r=>ev.push(r))}recs=[];cur=null;explicit=false};

          const gone=sl.after?sl.names.filter(n=>!sl.after.names.some(a=>fold(a.name)===fold(n.name))):sl.names;
          recs=gone.map(n=>({type:'huy',sess:sl,client:n.name,guest:n.guest,post:msg.at,author:msg.author,lines:[]}));

      if(!isCancel){const e=ev[ev.length-1];if(e&&e.sess===sess)e.lines.push(l);continue}
      const nm=l.match(/^(.{2,40}?)\s+(?:\(1-[124]\)\s+)?(?:bị\s+)?(?:hu[ỷy]|hủy|huy|ko đến|không đến|ko ghé|không ghé)(?=[\s,.:;]|$)/i);
      if(nm&&!/^(lý|lí)\s*do|^(t?gian|giờ|thời gian)\s+báo/i.test(l)&&!/\b(ko|không)\s+bị\s+h/i.test(l)){
        const name=nm[1].replace(HONOR,'').trim();
        let r=recs.find(x=>fold(x.client).includes(fold(name))||fold(name).includes(fold(x.client)));
        if(!r){r={type:'huy',sess,client:name,post:msg.at,author:msg.author,lines:[]};recs.push(r)}
        r.explicit=true;explicit=true;cur=r;r.lines.push(l);continue;

      const tgt=cur?[cur]:recs;

    if(notes.length&&!ev.length)unk.push(...notes);

  ev.forEach(finishEv);

  ev.forEach((e,i)=>{if(e.type!=='huy')return;const k=fold(e.client);

    const nb=ev.slice(i+1).find(x=>x.type==='dat'&&(!e.post||!x.post||(x.post-e.post)<=2*36e5)&&x.sess.names.some(n=>fold(n.name).includes(k)||k.includes(fold(n.name))));

}
function finishEv(e){
  const txt=e.lines.join(' · '),f=fold(txt);
  e.reason=(e.lines.find(l=>/^(lý|lí)\s*do/i.test(l))||'').replace(/^(lý|lí)\s*do\s*:?\s*/i,'');
  if(e.type!=='huy'){e.note=txt;return}
  const tl=e.lines.find(l=>/(t?gian|giờ|thời gian)\s+báo/i.test(l))||'';

// Rule tính buổi khi khách huỷ: noCharge = báo trước ≥ X giờ thì không tính; charge = báo trước < Y giờ thì tính.
function expectCharge(e,R){

const DAYMAP={T2:0,T3:1,T4:2,T5:3,T6:4,T7:5,CN:6};
const norm=x=>String(x??'').trim();
const fold=x=>norm(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
function parseDays(t){
  const out=[];for(const part of t.split(',').map(norm).filter(Boolean)){
    const [a,b]=part.toUpperCase().split('-').map(norm);const da=DAYMAP[a],db=b?DAYMAP[b]:da;
    if(da==null||db==null||db<da)throw`ngày "${part}" không hiểu (dùng T2…T7, CN, ví dụ T2-T6 hoặc T2,T4)`;

// "7", "7h", "7h30", "7:30" → phút từ 0h
function tmin(x){const m=norm(x).toLowerCase().match(/^(\d{1,2})(?:[h:](\d{2})?)?h?$/);if(!m)throw`giờ "${x}" không hiểu (ví dụ 7, 7h30, 7:30)`;
  const H=+m[1],M=m[2]?+m[2]:0;if(H>23||M>59)throw`giờ "${x}" không hợp lệ`;return H*60+M}
const KINDS=['pilates','gym'];
// Đọc khung giờ: "T2-T6 6:15-10:15 Gym; T7 8-12" (khoảng) hoặc "T2,T4 7,8h30" (giờ bắt đầu cụ thể).
// Trả starts: các giờ bắt đầu buổi hợp lệ; kinds: môn riêng của từng giờ (nếu khung có ghi môn); win: các khung để tính giờ trực.
function parseWin(t,ptKinds){

    if(parts.length!==2)throw`"${seg}" thừa chữ; dạng đúng: "T2-T6 6-10 Gym"`;
    if(kind&&ptKinds&&!ptKinds.includes(kind))throw`khung "${seg}" ghi môn ${kind} nhưng HLV không dạy môn này`;

// Tập giờ bắt đầu → chữ gọn: các giờ cách nhau 30 phút gộp thành khoảng "7-9".
function avHuman(av){
  const by={};for(let d=0;d<7;d++){const hs=START.filter(t=>av.has(K(d,t)));if(!hs.length)continue;
    const runs=[];hs.forEach(t=>{const r=runs[runs.length-1];if(r&&r[1]===t)r[1]=t+STEP;else runs.push([t,t+STEP])});
    runs.forEach(([a,b])=>{const k=b-a===STEP?hmc(a):`${hmc(a)}-${hmc(b-STEP+DUR)}`;(by[k]=by[k]||[]).push(d)})}
  const dayTxt=ds=>{const r=[];ds.forEach(d=>{const x=r[r.length-1];if(x&&x[1]===d-1)x[1]=d;else r.push([d,d])});
    return r.map(([a,b])=>a===b?DOWS[a]:b===a+1?DOWS[a]+','+DOWS[b]:DOWS[a]+'-'+DOWS[b]).join(',')};
  return Object.entries(by).map(([k,ds])=>`${dayTxt(ds)} ${k}`).join('; ');
}
// Giờ trực theo ngày (phút), gộp các khung chồng nhau.
function dutyMin(win){
  const out=[0,0,0,0,0,0,0];
  for(let d=0;d<7;d++){const w=win.filter(x=>x.d===d).sort((x,y)=>x.a-y.a);let ca=-1,cb=-1;
    w.forEach(x=>{if(x.a>cb){if(cb>ca)out[d]+=cb-ca;ca=x.a;cb=x.b}else cb=Math.max(cb,x.b)});if(cb>ca)out[d]+=cb-ca}
  return out;
}

function rowsOf(text,tpl,alias={}){
  const L=norm(text).split(/\r?\n/).map((l,i)=>({n:i+1,c:splitRow(l).map(norm)})).filter(r=>r.c.some(Boolean));
  if(!L.length)return[];
  const names=tpl.map(t=>[fold(t),...(alias[t]||[]).map(fold)]);
  const head=L[0].c.map(fold);
  const isHead=head.some(h=>names.some(ns=>ns.includes(h)));
  let idx=tpl.map((_,i)=>i);
  if(isHead){idx=names.map(ns=>head.findIndex(h=>ns.includes(h)));L.shift()}
  return L.map(r=>({n:r.n,c:idx.map(i=>i<0?'':r.c[i]??'')}));
}

function parseInput(inp){

    if(!name)throw'thiếu tên';const k=CT_IN[fold(ct)];if(!k)throw`hợp đồng "${ct}" phải là full-time, part-time hoặc theo ca`;
    const f=list(fit);if(!f.length||f.some(x=>!['1-1','1-2'].includes(x)))throw'hợp lớp phải là 1-1, 1-2 hoặc cả hai';

    const ks=list(kinds).map(x=>x[0].toUpperCase()+x.slice(1).toLowerCase());if(!ks.length)throw'thiếu môn dạy';
    parseWin(av,ks);

      dutyDayMax:num(ddmax,10,'max giờ trực/ngày'),dutyWeekMax:num(dwmax,48,'max giờ trực/tuần'),av:norm(av)});
  }catch(m){E('PT',n,m)}});
  const ptBy=x=>pts.find(p=>fold(p.name)===fold(x)||fold(p.name.split(' ').slice(-1)[0])===fold(x));
  rowsOf(inp.kh,TPL.kh,ALIAS).forEach(({n,c},i)=>{try{

    const n0=num(nb,null,'số buổi');if(!n0)throw'số buổi phải lớn hơn 0';
    let pid=null;if(norm(pref)){const p=ptBy(pref);if(!p)throw`không thấy PT "${pref}" trong bảng PT`;pid=p.id}
    parseWin(av);

  }catch(m){E('Khách',n,m)}});
  rowsOf(inp.lich,TPL.lich,ALIAS).forEach(({n,c})=>{try{
    const[kn,dd,hh,pn]=c;const k=cls.find(x=>fold(x[1])===fold(kn)||fold(x[1].split(' ').slice(-1)[0])===fold(kn));

    const h=tmin(hh);if(!START.includes(h))throw`giờ ${hm(h)} phải từ 6h đến 20h, chẵn :00 hoặc :30`;const p=ptBy(pn);if(!p)throw`không thấy PT "${pn}" trong bảng PT`;

}

  const rows=MET.map(m=>{const a=m.f(A),b=m.f(B),c=C&&m.f(C);
    const n=WK.log.filter(l=>l.deltas[m.id]!=null).length;
    return `<tr class="${state.met===m.id?'sel':''}" data-met="${m.id}" style="cursor:pointer"><td>${m.name}${m.sub?`<br><small class="faint">${m.sub}</small>`:''}${n?` <span class="chip">${n} thay đổi</span>`:''}</td>
     <td class="n">${fmt(m,a)}</td><td class="n">${fmt(m,b)}</td><td class="n">${C?fmt(m,c):'<span class="faint">—</span>'}</td>
     <td class="n">${delta(m,mval(a),mval(b))}</td><td class="n">${C?delta(m,mval(b),mval(c)):'<span class="faint">—</span>'}</td>${H?`<td class="n hd">${fmt(m,m.f(H))}</td><td class="n">${delta(m,mval(m.f(H)),mval(a))}</td>`:''}</tr>`}).join('');
  const k1=keep(A,B),k2=C&&keep(B,C);
  const kr=`<tr><td>Giữ nguyên lịch<br><small class="faint">buổi còn đúng ô và PT so với bản trước</small></td><td class="n"><span class="faint">—</span></td>
    <td class="n">${fmt({},k1)}</td><td class="n">${C?fmt({},k2):'<span class="faint">—</span>'}</td><td></td><td></td>${H?`<td class="n hd"><span class="faint">—</span></td><td></td>`:''}</tr>`
   +(H?`<tr><td>Máy trùng lịch DN<br><small class="faint">buổi máy xếp đúng ô và PT như DN xếp tay</small></td><td class="n">${fmt({},keep(H,A))}</td><td colspan="4"></td><td class="n hd"><span class="faint">—</span></td><td></td></tr>`:'');
  let dr='';
  if(state.met){const m=MET.find(x=>x.id===state.met),ls=WK.log.filter(l=>l.deltas[m.id]!=null);
    dr=`<div class="box" style="margin-top:12px"><h3>${m.name}: các thay đổi gây lệch</h3>${ls.length?`<div class="tw"><table><tr><th>Bản</th><th>Khách</th><th>Từ → sang</th><th>Lý do</th><th class="n">Ảnh hưởng</th></tr>
      ${ls.map(l=>`<tr><td>${l.phase==='tuan'?'v'+l.ver:'Trước chốt'}</td><td>${esc(CB[l.c].short)}</td><td>${pS(l.from)} → ${l.to?pS(l.to):'<b>huỷ, ghi buổi nợ</b>'}</td><td>${l.reason}</td><td class="n">${delta(m,0,l.deltas[m.id])}</td></tr>`).join('')}</table></div>`
      :'<div class="muted" style="font-size:13.5px">Chưa có thay đổi nào làm lệch tiêu chí này.</div>'}</div>`}
  return `<div class="tw"><table class="mt"><tr><th>Tiêu chí</th><th class="n">Máy xếp</th><th class="n">${WK.locked?'CS chốt':'CS chốt (đang soạn)'}</th><th class="n">Thực tế</th><th class="n">Máy → chốt</th><th class="n">Chốt → thực tế</th>${H?'<th class="n hd">Lịch DN xếp tay</th><th class="n">DN → máy</th>':''}</tr>${rows}${kr}</table></div>
  <p class="cap">Lệch tính bằng điểm phần trăm, riêng "Lần phạm rule" tính bằng số lần. Xanh là tốt lên, đỏ là xấu đi. Bấm một dòng để xem thay đổi nào gây lệch.${H?' Cột "DN → máy": xanh là máy làm tốt hơn lịch DN xếp tay ở tiêu chí đó.':''}</p>${dr}`;
}
function reasons(){
  if(!WK.log.length)return'';
  const t={};WK.log.forEach(l=>{const k=l.reason;t[k]=t[k]||{chot:0,tuan:0};t[k][l.phase]++});
  return `<div><h3>Lệch theo lý do</h3><div class="tw"><table><tr><th>Lý do</th><th class="n">Trước chốt</th><th class="n">Trong tuần</th></tr>
   ${Object.keys(t).map(k=>`<tr><td>${k}</td><td class="n">${t[k].chot}</td><td class="n">${t[k].tuan}</td></tr>`).join('')}</table></div>
   <p class="cap">Một lý do lặp lại nhiều tuần là tín hiệu FFL nên chốt thành rule.</p></div>`;
}

   ${WK.log.map(l=>`<tr><td>${l.phase==='tuan'?'v'+l.ver:'Trước chốt'}</td><td>${esc(CB[l.c].short)}</td><td>${pS(l.from)} → ${l.to?pS(l.to):'<b>huỷ, ghi buổi nợ</b>'}</td><td>${l.reason}</td></tr>`).join('')}</table></div>`

function moveBox(){
  const m=state.mv,s0=SESS.find(x=>x.id===m.sid);if(!s0){state.mv=null;return''}
  const c=CB[m.c],av=m.av?toAv(m.av):c.av,opts=moveOptions(c,s0,av,m.av!=null);state.opts=opts;const N=m.all?opts.length:5;

   ${r?`<div class="fl">${esc(r.text)}<small>Máy tìm theo giờ rảnh mới khách báo.</small></div>`:`<div class="cap">${m.av?'Máy tìm theo giờ rảnh mới: '+esc(avHuman(av)):'Máy tìm theo giờ rảnh khách khai đầu tuần.'}</div>
   <div class="row" style="margin-top:6px"><input id="mv-av" class="b" placeholder="Giờ rảnh mới, ví dụ T5-T6 17-20" value="${esc(m.avTxt||'')}" style="flex:1;min-width:0"><button class="b" data-mvav>Tìm lại</button></div>${m.avErr?`<div class="cap" style="color:var(--bad)">${esc(m.avErr)}</div>`:''}`}
   <label style="display:block;font-size:13px;margin:10px 0 6px">Lý do <select id="rs" class="b" style="height:32px;margin-left:6px">${REASONS.map(x=>`<option${x===(r?'Khách yêu cầu':'CS thấy hợp hơn')?' selected':''}>${x}</option>`).join('')}</select></label>
   <div class="muted" style="font-size:12.5px;margin:8px 0 4px">${opts.length?`Phương án (${Math.min(opts.length,N)}/${opts.length}), xếp theo bộ rule đã dùng tuần này. Các ca khác giữ nguyên.`:'Không có ô trống nào hợp lệ. CS có thể hỏi khách khác đổi, hoặc huỷ buổi.'}</div>

}
function detail4(){
  const s=SESS.find(x=>x.id===state.sel);if(!s)return'';
  return `<div class="box dt fade"><button class="x" data-close>Đóng</button><h3>${slotT(s.d,s.h)}</h3>
   <div class="muted" style="font-size:13px">PT ${PB[s.p].name} · ${s.kind} lớp ${s.cls}${s.cls==='1-2'?` · ${s.bk.length}/2 chỗ`:''}</div>
   ${s.bk.map(b=>`<div style="margin-top:10px"><b>${esc(CB[b.c].name)}</b> <span class="chip ${isTmp(b)?'w':'ok'}">${isTmp(b)?'Gán tạm':b.cs?'CS đổi':b.ok?'CS chốt':'Xếp theo rule'}</span>

function step4(){
  const base=WK.locked?WK.chot:WK.may,bk=bkeys(base);
  state.chg4=new Set([...bkeys(snap())].filter(k=>!bk.has(k)));
  const tmp=allBk().filter(x=>isTmp(x.b));
  const head=WK.locked
    ?`<div class="banner">Đã chốt và gửi lịch bản v1 cho khách và PT. Hiện là <b>bản v${WK.ver}</b>, có <b>${WK.ver-1}</b> thay đổi trong tuần. Mọi thay đổi từ giờ tính vào cột "Thực tế".</div>`
    :`<div class="banner">CS xử lý các ca gán tạm (giữ phương án máy hoặc đổi), rồi bấm chốt. Chỉnh sửa lúc này tính vào cột "CS chốt".

  const rail=WK.locked&&CUR.kind!=='mau'?`<div class="box"><h3>Đổi lịch trong tuần</h3><p class="cap">Khách hoặc PT báo đổi thì bấm vào ca trên lịch, chọn "Đổi lịch", nhập giờ rảnh mới nếu có.</p></div>`
   :WK.locked
    ?`<div class="box"><h3>Yêu cầu đổi trong tuần</h3>${REQS.map((r,i)=>{const s=reqSess(r),dn=reqDone(i);
       return `<button class="todo${dn?'':''}" data-req="${i}" ${dn||!s?'disabled':''} style="${dn?'opacity:.55;border-left-color:var(--accent)':''}"><b>${esc(CB[r.c].short)} · ${slotS(r.d,r.h)}</b><span>${esc(r.text)}</span><span class="hint">${dn?'Đã xử lý':s?'Bấm để xem phương án':'Không thấy buổi này trên lịch'}</span></button>`}).join('')}<p class="cap">Kịch bản demo. Thật ra CS nhận qua điện thoại hoặc Zalo rồi bấm "Đổi lịch" trên ca.</p></div>`
    :`<div class="box"><h3>Chờ CS chốt <span class="chip ${tmp.length?'w':''}">${tmp.length}</span></h3>${tmp.map(({s,b})=>`<button class="todo" data-s="${s.id}"><b>${esc(CB[b.c].short)} · ${slotS(s.d,s.h)} · PT ${PB[s.p].short}</b><span>${esc(b.flags.find(f=>f.code[0]==='T'||f.down).text)}</span></button>`).join('')||'<div class="muted" style="font-size:13.5px">Không còn ca nào.</div>'}</div>`;
  return `${head}<div class="l3"><div class="rail">${rail}</div>
   <div>${calendar()}<div class="lg"><span><i></i>xếp theo rule</span><span><i class="t"></i>gán tạm</span><span><i class="c"></i>${WK.locked?'khác lịch đã chốt':'khác bản máy xếp'}</span><span>Bấm một ca để chốt hoặc đổi lịch.</span></div></div>
   <div class="side">${state.mv?moveBox():detail4()}</div></div>

   <div class="below">${logBox()}${reasons()}</div>
   <div class="acts"><button class="b" data-go="3">← Kết quả máy xếp</button></div>`;
}

  <section><h2>Máy xử lý từng buổi</h2><ol class="alg">
   <li><b>Chuẩn bị.</b> Dựng lưới 7 ngày, buổi dài 60 phút, bắt đầu mỗi 30 phút từ 6:00 đến 20:00. Kiểm lịch trực HLV (giờ/ngày, giờ/tuần, số HLV có mặt). Nạp số ca mỗi PT đã xếp trong tháng (để tính tỉ lệ ca).</li>
   <li><b>Xếp thứ tự khách.</b> Khách có chọn PT xếp trước, sau đó tới khách ít ô rảnh nhất.<small>Khách khó xếp cần được giữ chỗ trước khi ô bị người khác lấy.</small></li>
   <li><b>Liệt kê lựa chọn.</b> Mỗi lựa chọn là một cặp (ô giờ khách rảnh, PT). Bỏ cặp phạm rule nền, rồi bỏ cặp phạm rule giới hạn đang bật. Máy đếm mỗi rule đã bỏ bao nhiêu cặp.</li>
   <li><b>PT khách chọn (U1).</b> PT đó còn ô thì xếp luôn. PT đang bận vì khách không chọn đích danh thì dời khách kia sang PT khác cùng giờ. Bận vì khách cũng chọn đích danh thì không tự quyết, ghi T1.</li>
   <li><b>Lọc dần theo rule ưu tiên.</b> Đi từ rule trên xuống, mỗi rule chỉ giữ các lựa chọn tốt nhất theo rule đó. Rule nào làm số PT còn lại từ nhiều thành một thì là <i>rule quyết định</i>, ghi lên ca.<small>Không cộng điểm, nên lúc nào cũng nói được ca này do rule nào quyết.</small></li>
   <li><b>Ghi ca.</b> Lớp 1-2 có thể ghép vào ca có sẵn. Gặp edge case thì vẫn ghi phương án tốt nhất, gắn mã T và đánh dấu gán tạm. Mỗi khách đi qua tối đa 4 vòng cho đủ số buổi.</li>
   <li><b>Rà cuối.</b> Lớp 1-2 vẫn lẻ thì ghi T5. Khoảng trống trong ngày dài hơn 2 ca mà ngắn hơn mức PT khai thì ghi G5.<small>G5 chỉ kiểm cuối vì một khoảng trống có thể được lấp bởi ca xếp sau.</small></li>
  </ol></section>

    <span class="row" style="margin-left:auto">Báo trước ≥ <input id="thr-no" class="b" type="number" min="0" step="0.5" value="${R.noCharge}" style="width:70px" data-thrrule="noCharge"> h thì không tính · dưới <input id="thr-yes" class="b" type="number" min="0" step="0.5" value="${R.charge}" style="width:70px" data-thrrule="charge"> h thì tính</span></div></section>
  ${res?`<section>
   <div class="kpi"><div><b>${ev.length}</b>sự kiện</div><div><b>${cx.filter(e=>e.kind==='huy').length}</b>khách huỷ</div><div class="w"><b>${cx.filter(e=>e.kind==='vang').length}</b>vắng hoặc báo sau giờ</div><div class="bd"><b>${cx.filter(e=>e.kind==='studio').length}</b>studio huỷ lớp</div><div><b>${ev.filter(e=>e.type==='dat').length}</b>đặt lịch</div><div><b>${ev.filter(e=>e.type==='trial').length}</b>trial</div><div><b>${charged}/${charged+free}</b>huỷ bị tính buổi</div></div>
   <div class="below" style="margin-top:0">
    <div><h3>Lệch hoặc thiếu rule <span class="chip ${mism.length+gap.length?'bad':'ok'}">${mism.length+gap.length}</span></h3>${mism.length+gap.length?[...mism,...gap].map(e=>`<div class="fl">${esc(e.client)} · ${sessTxt(e.sess)} · báo trước ${leadTxt(e)}<small>${e.exp.gap?'Nằm trong khoảng chưa có rule.':`Ghi nhận ${e.charged?'tính':'không tính'}, rule ra ${e.exp.v?'tính':'không tính'}.`}${e.exception?' Ghi chú: '+esc(e.exception)+'.':''}</small></div>`).join(''):'<div class="muted" style="font-size:13.5px">Mọi ca huỷ đều khớp rule đang đặt.</div>'}
     <p class="cap">Mỗi dòng ở đây là một câu FFL cần trả lời, hoặc một ngoại lệ nên thành rule.</p></div>
    <div><h3>Huỷ theo mức báo trước</h3>${bar(byB,BUCKETS.filter(k=>byB[k]))}</div>
    <div><h3>Huỷ theo HLV</h3>${bar(byH)}</div>
   </div></section>
  <section><div class="tah"><h3>Nhật ký (${ev.length})</h3><button class="b sm" data-thrcopy>Chép bảng để dán vào Sheets</button></div>
   <div class="tw"><table><tr><th class="n">Buổi</th><th>Lớp</th><th>HLV</th><th>Khách</th><th>Loại</th><th class="n">Báo trước</th><th>Lý do</th><th>Ghi nhận</th><th>Theo rule</th></tr>${rows}</table></div>
   ${res.unk.length?`<div class="box" style="margin-top:12px"><h3>Dòng máy chưa hiểu <span class="chip">${res.unk.length}</span></h3>${res.unk.slice(0,20).map(u=>`<div class="cap">${esc(u)}</div>`).join('')}</div>`:''}</section>`
  :'<p class="muted">Dán thread rồi bấm "Đọc thread", hoặc thử với ví dụ.</p>'}
  </div>`;
}
function render(){
  $('#steps').innerHTML=[['1','Đầu vào'],['2','Rule'],['3','Kết quả'],['4','Chốt & trong tuần']].map(([n,t],i)=>`${i?'<span class="sp">›</span>':''}<button role="tab" aria-selected="${state.step==n}" data-go="${n}"><span class="no">${n}</span>${t}</button>`).join('')
    +`<button role="tab" class="tabx" aria-selected="${state.step===5}" data-go="5">Đọc thread CS</button><button role="tab" aria-selected="${state.step===0}" data-go="0">Hệ thống chạy</button>`;
  $('#meta').textContent=`Fit For Life · tuần ${weekLabel()} · `+(CUR.kind==='mau'?'dữ liệu mẫu, soạn theo kịch bản':`dữ liệu DN tự nhập · ${PTS.length} PT, ${CL.length} khách${CUR.hand?' · có lịch DN xếp tay để so':''}`);
  const app=$('#app');
  app.innerHTML=state.step===5?thrTab():state.step===0?sysTab():state.step===1?step1():state.step===2?step2():state.step===3?step3():step4();
  app.classList.toggle('fade',state.anim);state.anim=false;
}
function go(n){
  n=+n;
  if(n>=3&&n<=4&&(!state.ran||state.dirty))doRun();
  if(n===4&&!WK.may){WK.may=snap();WK.hand=CUR.hand?handSnap():null}
  if(n!==4)state.mv=null;
  if(n!==state.step){state.step=n;state.anim=true;window.scrollTo(0,0)}
  render();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-tg],[data-up],[data-dn],[data-reset],[data-s],[data-hc],[data-hp],[data-close],[data-late],[data-mv],[data-ok],[data-pick],[data-mvx],[data-lock],[data-req],[data-met],[data-more],[data-inm],[data-tpl],[data-apply],[data-fill],[data-usemau],[data-mvav],[data-thrread],[data-thrsample],[data-thrclear],[data-thrcopy]');
  if(!t||t.disabled)return;const d=t.dataset;
  if(d.go)return go(d.go);
  if('thrread' in d){state.thr.text=$('#thr-in').value;saveThr(state.thr.text)}
  else if('thrsample' in d){state.thr.text=THR_SAMPLE}
  else if('thrclear' in d){state.thr.text='';saveThr('')}
  else if('thrcopy' in d){navigator.clipboard?.writeText(state.thrTsv).then(()=>{t.textContent='Đã chép'},()=>{t.textContent='Không chép được'});return}
  else if(d.inm){state.inMode=d.inm;state.inErr=null;state.inOk=false}
  else if(d.tpl){const txt=TPL[d.tpl].join('\t');const ta=document.querySelector(`[data-in="${d.tpl}"]`);
    navigator.clipboard?.writeText(txt).then(()=>{t.textContent='Đã chép'},()=>{ta.value=txt+'\n'+ta.value;ta.select()});return}
  else if('fill' in d){state.inp=sampleInput();saveInput();state.inErr=null;state.inOk=false}
  else if('apply' in d){const r=parseInput(state.inp);state.inErr=r.err;state.inOk=!r.err.length;
    if(!r.err.length){CUR=r.data;setWeek(CUR.week);state.ran=false;state.late=false;resetWeek();seed()}}
  else if('usemau' in d){CUR={kind:'mau',pts:DEF_PTS,cls:DEF_CL,hand:null,week:'2026-10-05'};setWeek(CUR.week);state.ran=false;state.late=false;resetWeek();seed()}
  else if('mvav' in d){const v=$('#mv-av').value;state.mv.avTxt=v;try{state.mv.av=v.trim()?[...parseAvHuman(v)]:null;state.mv.avErr=null}catch(m){state.mv.avErr=m}}
  if(d.tg){CFG[d.tg].on=!CFG[d.tg].on;state.dirty=true}
  else if(d.up||d.dn){const id=d.up||d.dn,i=UORD.indexOf(id),j=i+(d.up?-1:1);if(j>=1&&j<UORD.length){[UORD[i],UORD[j]]=[UORD[j],UORD[i]];state.dirty=true}}
  else if('reset' in d){defaultCfg();state.dirty=true}
  else if(d.mv){const[sid,c]=d.mv.split('|');state.mv={sid:+sid,c,av:null,req:null}}
  else if(d.req){const r=REQS[+d.req],s=reqSess(r);if(s){state.sel=s.id;state.mv={sid:s.id,c:r.c,av:r.av,req:+d.req}}}
  else if(d.ok){const[sid,c]=d.ok.split('|');const s=SESS.find(x=>x.id===+sid);s.bk.find(b=>b.c===c).ok=true}
  else if('mvx' in d)state.mv=null;
  else if('more' in d)state.mv.all=true;
  else if(d.pick){const m=state.mv,s0=SESS.find(x=>x.id===m.sid),c=CB[m.c],x=+d.pick<0?null:state.opts[+d.pick];
    const ns=applyMove(c,s0,x,$('#rs').value,m.req);state.sel=ns?ns.id:null;state.mv=null}
  else if('lock' in d){WK.chot=snap();WK.locked=true;WK.ver=1;state.sel=null;state.mv=null}
  else if(d.met)state.met=state.met===d.met?null:d.met;
  else if(d.s){const id=+d.s;state.sel=state.sel===id?null:id;state.mv=null}
  else if(d.hc){state.hi=state.hi&&state.hi.id===d.hc?null:{t:'c',id:d.hc};state.sel=null}
  else if(d.hp){state.hi=state.hi&&state.hi.id===d.hp?null:{t:'p',id:d.hp};state.sel=null}
  else if('close' in d)state.sel=null;
  else if('late' in d){state.late=true;const prev=keysNow();addLate();state.chg=new Set([...keysNow()].filter(k=>!prev.has(k)));state.sel=null;state.hi=null}
  render();
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.thrrule;if(k){const v=parseFloat(e.target.value);if(!isNaN(v)){state.thr.rule[k]=v;state.thr.text=$('#thr-in').value;render()}}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k){state.inp[k]=e.target.value;saveInput()}});
state.inp=loadInput();state.thr.text=loadThr();
defaultCfg();seed();resetWeek();render();
</script>
</body>
</html>
