<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fit For Life — Xếp ca tự động</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1170 1170'%3E%3Crect width='1170' height='1170' fill='%23fdf8e8'/%3E%3Ccircle cx='585' cy='585' r='560' fill='none' stroke='%231f1c16' stroke-width='40'/%3E%3Cpath d='M640 470C700 340 770 200 830 200C880 205 895 250 860 310C800 400 640 480 500 525C330 585 170 560 130 330M610 480C560 590 500 690 430 790C380 860 340 920 300 920C250 920 225 870 250 820C290 750 390 715 500 712C700 720 850 790 1000 795C1090 795 1130 700 1135 590' fill='none' stroke='%231f1c16' stroke-width='40' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fffdf7; --soft:#f8f3e5; --ink:#1f1c16; --muted:#6b6557; --faint:#9a927f; --line:#ece5d2;
  --accent:#0f8a70; --accent-ink:#fff; --alt:#d47a2c;
  --ok:#15803d; --warn:#b7791f; --bad:#c0392b;
  --accent-soft:color-mix(in srgb,var(--accent) 9%,var(--bg));
  --shadow:0 24px 60px rgba(31,28,22,.22);
}
:root[data-theme="dark"]{
  --bg:#16150f; --soft:#1d1b14; --ink:#eee9d8; --muted:#a29b88; --faint:#71695a; --line:#2b281d;
  --accent:#22a086; --accent-ink:#06120e; --alt:#d5772f;
  --ok:#4ade80; --warn:#e0b04a; --bad:#f08070;
  --shadow:0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* dev switcher — không thuộc thiết kế */
.dev{display:flex;gap:4px;align-items:center;padding:8px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
.dev b{margin:0 6px 0 0;font-weight:600}
.dev .gap{width:16px}
.dev button,.dev a{padding:4px 12px;border-radius:999px;color:var(--muted);font-size:12px;text-decoration:none}
.dev button:hover,.dev a:hover{color:var(--ink)}
.dev button.on{background:var(--ink);color:var(--bg)}

/* buttons + form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:10px;font-weight:600;white-space:nowrap;transition:filter .12s,border-color .12s,background .12s}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)} .btn.pri:active{filter:brightness(.95)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.line{border:1px solid var(--line)} .btn.line:hover{border-color:var(--faint)}
.btn.ghost{color:var(--muted);font-weight:500;padding:0 12px}
.btn.ghost:hover{color:var(--ink)}
.btn.bad{color:var(--bad)}
.btn.sm{height:34px;padding:0 14px;font-size:14px}
.btn.xs{height:28px;padding:0 10px;font-size:13px;border-radius:8px}
.inp,select{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);outline:none;min-width:0;width:100%}
.inp:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft);outline:none;line-height:1.5;resize:vertical;min-height:64px}
.link{color:var(--accent);font-size:13px;font-weight:500}
.link:hover{text-decoration:none;filter:brightness(1.15)}

/* khung */
.staff{height:calc(100vh - 41px);min-height:640px;display:flex;flex-direction:column}
.top{height:56px;flex:none;display:flex;align-items:center;gap:28px;padding:0 28px;border-bottom:1px solid var(--line)}
.wm{display:flex;align-items:center;gap:10px;white-space:nowrap}
.wm svg{width:30px;height:30px;flex:none}
.wm b{font-weight:600;letter-spacing:.14em;font-size:13px}
.wm span{font-weight:450;color:var(--muted);padding-left:12px;border-left:1px solid var(--line);margin-left:2px;font-size:14px}
.nav{display:flex;gap:4px;height:100%}
.nav button{padding:0 14px;color:var(--muted);font-weight:500;position:relative;height:100%;white-space:nowrap}
.nav button:hover,.nav button.on{color:var(--ink)}
.nav button.on:after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.nav small{color:var(--warn);font-weight:600;margin-left:4px}
.auto{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.auto:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.av{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
#sbody{flex:1;min-height:0;display:flex;flex-direction:column}

/* thanh công cụ */
.tb{flex:none;display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tb .dt{font-weight:600;font-size:17px;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.tb .sp{flex:1}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{padding:5px 14px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(31,28,22,.12);font-weight:600}
.days{flex:none;display:flex;gap:4px;padding:8px 28px;border-bottom:1px solid var(--line);overflow:auto}
.days button{padding:6px 12px;border-radius:8px;font-size:13.5px;color:var(--muted);white-space:nowrap;text-align:left;line-height:1.3}
.days button small{display:block;font-size:12px;color:var(--faint)}
.days button:hover{background:var(--soft);color:var(--ink)}
.days button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.days button.on small{color:var(--accent)}
.strip{flex:none;display:flex;gap:22px;align-items:center;padding:9px 28px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);flex-wrap:wrap}
.strip b{color:var(--ink);font-weight:600}
.strip .w,.strip .w b{color:var(--warn)}
.strip .lgd{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--faint)}
.strip .lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px}
.cal{min-width:0;min-height:0;overflow:auto;position:relative}
.panel{border-left:1px solid var(--line);overflow:auto;min-height:0}

/* chip */
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.g{background:color-mix(in srgb,var(--accent) 14%,var(--bg));color:var(--accent)}
.chip.p{background:color-mix(in srgb,var(--alt) 15%,var(--bg));color:color-mix(in srgb,var(--alt) 80%,var(--ink))}
.chip.w{background:color-mix(in srgb,var(--warn) 16%,var(--bg));color:var(--warn)}
.chip.b{background:color-mix(in srgb,var(--bad) 12%,var(--bg));color:var(--bad)}
.chip.o{background:color-mix(in srgb,var(--ok) 13%,var(--bg));color:var(--ok)}
.kd{--k:var(--accent)} .kd.Pilates{--k:var(--alt)}

/* lưới ngày: giờ × PT */
.gh,.gb{display:grid;grid-template-columns:56px repeat(var(--n),minmax(140px,1fr));min-width:calc(56px + var(--n)*140px)}
.gh{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.gh>div{padding:10px 12px;border-left:1px solid var(--line)}
.gh>div:first-child{border-left:0}
.gh button{display:block;width:100%;text-align:left;border-radius:6px}
.gh button:hover .n{color:var(--accent)}
.gh .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh .s{margin-top:3px;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.gb{height:calc(10*56px);position:relative}
.gut{position:relative}
.gut span{position:absolute;right:8px;font-size:11.5px;color:var(--faint);transform:translateY(-8px)}
.gut span:first-child{transform:none}
.gcol{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line) 55px,var(--line) 56px)}
.na{position:absolute;left:0;right:0;height:56px;background:repeating-linear-gradient(135deg,var(--soft) 0 5px,transparent 5px 10px);pointer-events:none}
.gcol.off{background:repeating-linear-gradient(135deg,var(--soft) 0 5px,transparent 5px 10px)}
.gcol.off:after{content:attr(data-off);position:absolute;top:16px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--faint)}
.blk{position:absolute;left:4px;right:4px;height:52px;border-radius:8px;padding:5px 8px;text-align:left;overflow:hidden;background:color-mix(in srgb,var(--k) 12%,var(--bg));border-left:3px solid var(--k);font-size:12.5px;line-height:1.3;display:block;transition:background .12s}
.blk:hover{background:color-mix(in srgb,var(--k) 20%,var(--bg))}
.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.blk span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.on{box-shadow:0 0 0 2px var(--k)}
.blk.cf{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 14%,var(--bg)) 0 6px,var(--bg) 6px 12px);border-left-color:var(--warn)}
.blk .nw{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* tuần: PT × ngày */
.wk{display:grid;grid-template-columns:200px repeat(7,minmax(118px,1fr));min-width:1040px}
.wk>div{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:10px 12px;min-height:70px}
.wk>div:nth-child(8n+1){border-left:0}
.wk .hd{position:sticky;top:0;z-index:5;background:var(--bg);min-height:0;font-size:13px;color:var(--muted);font-weight:600}
.wk .hd small{display:block;font-weight:500;color:var(--faint)}
.wk .rn{display:block;width:100%;text-align:left}
.wk .rn b{display:block;font-weight:600}
.wk .rn:hover b{color:var(--accent)}
.wk .cell{display:block;width:100%;text-align:left;font-size:12px;color:var(--muted);border-radius:6px;padding:2px}
.wk .cell:hover{background:var(--soft)}
.wk .cell .c{margin-top:6px}
.bars{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.bars i{height:18px;border-radius:3px;background:transparent;border:1px dashed var(--line)}
.bars i.fr{background:var(--soft);border:0}
.bars i.s{background:var(--k);border:0}
.wk .cell.off{color:var(--faint);font-size:12.5px;padding-top:6px}

/* panel chi tiết */
.pin{padding:24px 26px 40px}
.crumb{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.x{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:18px}.x:hover{background:var(--soft);color:var(--ink)}
.pin h2{font-size:21px;letter-spacing:-.02em;line-height:1.3;margin-top:6px;font-weight:600}
.meta{margin-top:4px;color:var(--muted);font-size:14px}
.sblk{margin-top:24px}
.sblk h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sblk h3 .chip{font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:500}
.why{list-style:none}
.why li{font-size:13.5px;padding:3px 0 3px 20px;position:relative}
.why li:before{content:"✓";position:absolute;left:2px;color:var(--ok);font-weight:600}
.why li.w:before{content:"!";color:var(--warn)}
.why li.m:before{content:"↻";color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.item .a{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item b{font-weight:600}
.item .r{font-size:13.5px;color:var(--muted);margin-top:3px}
.item.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--bg));background:color-mix(in srgb,var(--warn) 6%,var(--bg))}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.vs>div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:13px}
.vs b{display:block;font-size:14px}
.vs .h{color:var(--muted);margin:4px 0 8px;min-height:38px}
.vs .btn{width:100%}
.note{font-size:12.5px;color:var(--faint);margin-top:8px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:14px}
.nums>div{padding:12px 0 12px 14px;border-left:1px solid var(--line)}
.nums>div:first-child{border-left:0;padding-left:0}
.nums b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}
.nums span{font-size:12.5px;color:var(--muted)}
.mini{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px;margin-top:4px;border:1px solid var(--line)}
.mini:hover{background:var(--soft)}
.mini span{color:var(--muted)}
.lg{list-style:none}
.lg li{font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.lg li:last-child{border-bottom:0}
.lg li small{display:block;color:var(--muted);font-size:12.5px}
.ntf{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.intro ol{margin:10px 0 0 18px;font-size:14px}
.intro ol li{padding:3px 0}
.intro ol li b{font-weight:600}

/* lưới giờ rảnh nhỏ (panel) */
.ag{display:grid;grid-template-columns:30px repeat(7,1fr);gap:2px;font-size:11px;color:var(--faint);margin-top:6px}
.ag span{text-align:center}
.ag i{height:12px;border-radius:2px;background:var(--soft)}
.ag i.y{background:color-mix(in srgb,var(--k) 55%,var(--bg))}
.ag i.s{background:var(--k)}
.ag .hl{text-align:right;padding-right:4px;line-height:12px}

/* trang danh sách */
.page{flex:1;overflow:auto}
.pin2{max-width:980px;margin:0 auto;padding:28px 28px 60px}
.pin2 h2{font-size:21px;letter-spacing:-.02em;font-weight:600}
.pin2 .lead{color:var(--muted);margin-top:4px;font-size:14px}
.tbl{margin-top:18px;border-top:1px solid var(--line)}
.tr{display:grid;gap:16px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:14px}
.tr.h{font-size:12px;color:var(--faint);font-weight:600;padding:10px 4px}
.tr b{font-weight:600}
.tr .sub{font-size:12.5px;color:var(--muted)}
.tr.pt{grid-template-columns:minmax(160px,1.2fr) 100px 150px minmax(210px,1.6fr) 90px}
.tr.rq{grid-template-columns:minmax(150px,1.1fr) 80px 60px minmax(170px,1.5fr) 110px 110px 90px}
.tr .rt{text-align:right}
.linkbox{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);flex-wrap:wrap}
.linkbox code{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;flex:1;min-width:200px}
.dl{font-size:13.5px;color:var(--muted);margin-top:14px}
.dl b{color:var(--ink)}

/* điện thoại (form khách, PT) */
.phwrap{flex:1;overflow:auto;padding:28px 16px 60px;background:var(--soft)}
.phone{max-width:400px;margin:0 auto;background:var(--bg);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.ph-hd{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.ph-hd .wm span{font-size:13px}
.ph-hd h1{font-size:20px;font-weight:600;letter-spacing:-.015em;margin-top:14px;line-height:1.3}
.ph-hd p{color:var(--muted);font-size:14px;margin-top:4px}
.ph-bd{padding:4px 20px 24px}
.fq{margin-top:20px}
.fq>label,.fq>.lb{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.fq .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.fq .hint.w{color:var(--warn)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);font-weight:500;transition:border-color .12s,background .12s}
.opts button:hover{border-color:var(--faint)}
.opts button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.pg{display:grid;grid-template-columns:40px repeat(7,1fr);gap:3px;user-select:none}
.pg .dh,.pg .hr{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;border-radius:6px;font-weight:500}
.pg .dh small{display:block;font-size:11px;color:var(--faint);font-weight:400}
.pg button.dh:hover,.pg button.hr:hover{background:var(--soft);color:var(--ink)}
.pg .hr{text-align:right;padding-right:6px;line-height:28px}
.pg .c{height:32px;border-radius:6px;background:var(--soft);transition:background .12s}
.pg .c:hover{background:color-mix(in srgb,var(--accent) 18%,var(--bg))}
.pg .c.on{background:var(--accent)}
.pg .c.x{background:transparent;border:1px dashed var(--line);cursor:default}
.phone .btn.pri{width:100%;height:46px;margin-top:24px;font-size:15px}
.done{text-align:center;padding:36px 20px 30px}
.done .ok{width:56px;height:56px;border-radius:50%;background:color-mix(in srgb,var(--ok) 14%,var(--bg));color:var(--ok);display:grid;place-items:center;font-size:26px;margin:0 auto}
.done h2{font-size:19px;font-weight:600;margin-top:14px}
.done p{color:var(--muted);font-size:14px;margin-top:6px}
.sum{text-align:left;margin-top:18px;border-top:1px solid var(--line)}
.phsel{max-width:400px;margin:0 auto 14px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap;flex-wrap:wrap}
.phsel select{width:auto;height:34px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(31,28,22,.38);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.on{display:flex;animation:fi .2s cubic-bezier(.2,.7,.2,1)}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);border-radius:18px;width:100%;max-width:560px;padding:24px 26px;box-shadow:var(--shadow);max-height:92vh;overflow:auto}
.sheet h3{font-size:19px;letter-spacing:-.015em;font-weight:600}
.sheet .lead{color:var(--muted);font-size:14px;margin-top:4px}
.frow{margin-top:14px}
.frow>label,.frow>.lb{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:6px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--faint)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:3px}
.opt.on .rd{border:5px solid var(--accent)}
.opt b{font-weight:600}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.aff{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.aff:first-of-type{border-top:0}
.aff .t{font-size:14px}
.aff .t b{font-weight:600}

let DAYS;
function setWeek(mon){const t=new Date(mon+'T00:00:00Z');DAYS=[...Array(7)].map((_,i)=>new Date(t.getTime()+i*864e5).toISOString().slice(0,10))}

// Thời gian tính bằng phút từ 0h. Buổi dài DUR phút, bắt đầu mỗi STEP phút từ 6:00 đến 20:00.
const DUR=60,STEP=30,OPEN=360,LAST=1200;

function check(c,d,h,p,o={}){
  if(!p.kinds.includes(c.kind))return{no:'N1'};
  if(!(o.av||c.av).has(K(d,h)))return{no:'N2'};
  if(!p.av.has(K(d,h))||OFFD.has(p.id+'|'+d))return{no:'N3'};
  const wk=p.avk&&p.avk.get(K(d,h));if(wk&&!wk.includes(c.kind))return{no:'N3'};
  const lap=x=>x.id!==o.ignore&&x.d===d&&Math.abs(x.h-h)<DUR;
  if(SESS.some(x=>lap(x)&&x.bk.some(b=>b.c===c.id)))return{no:'N4'};
  let s=SESS.find(x=>x.p===p.id&&x.d===d&&x.h===h);if(s&&s.id===o.ignore)s=null;
  let join=null;
  if(s){if(c.cls!=='1-1'&&s.cls===c.cls&&s.kind===c.kind&&s.bk.length<CAP[c.cls])join=s;else return{no:'N4',blocker:s}}
  if(SESS.some(x=>lap(x)&&x.p===p.id&&x.h!==h))return{no:'N4'};
  if(on('G1')&&SESS.some(x=>x.id!==o.ignore&&x.d===d&&x.bk.some(b=>b.c===c.id)))return{no:'G1'};
  if(!join){
    const hs=SESS.filter(x=>x.p===p.id&&x.d===d&&x.id!==o.ignore).map(x=>x.h);
    if(on('G2')&&hs.length+1>p.dayMax)return{no:'G2'};
    if(on('G3')&&p.monthMax!=null&&p.done+weekCount(p)+1>p.monthMax)return{no:'G3'};
    if(on('G4')&&!runsOk(hs.concat(h),p))return{no:'G4'};
  }

}

  for(const[d,h]of keys)for(const p of PTS){

    if(r.ok){cands.push({d,h,p,join:r.join});base++;bpts.add(p.id);continue}
    if(r.no[0]==='G'){cut[r.no]=(cut[r.no]||0)+1;base++;bpts.add(p.id)}

  <section><h2>Máy xử lý từng buổi</h2><ol class="alg">
   <li><b>Chuẩn bị.</b> Dựng lưới 7 ngày, buổi dài 60 phút, bắt đầu mỗi 30 phút từ 6:00 đến 20:00. Kiểm lịch trực HLV (giờ/ngày, giờ/tuần, số HLV có mặt). Nạp số ca mỗi HLV đã xếp trong tháng (để tính tỉ lệ ca).</li>
   <li><b>Xếp thứ tự khách.</b> Khách có chọn HLV xếp trước, sau đó tới khách ít ô rảnh nhất.<small>Khách khó xếp cần được giữ chỗ trước khi ô bị người khác lấy.</small></li>
   <li><b>Liệt kê lựa chọn.</b> Mỗi lựa chọn là một cặp (ô giờ khách rảnh, HLV). Bỏ cặp phạm rule nền, rồi bỏ cặp phạm rule giới hạn đang bật. Máy đếm mỗi rule đã bỏ bao nhiêu cặp.</li>
   <li><b>HLV khách chọn (U1).</b> HLV đó còn ô thì xếp luôn. HLV đang bận vì khách không chọn đích danh thì dời khách kia sang HLV khác cùng giờ. Bận vì khách cũng chọn đích danh thì không tự quyết, ghi T1.</li>
   <li><b>Lọc dần theo rule ưu tiên.</b> Đi từ rule trên xuống, mỗi rule chỉ giữ các lựa chọn tốt nhất theo rule đó. Rule nào làm số HLV còn lại từ nhiều thành một thì là <i>rule quyết định</i>, ghi lên ca.<small>Không cộng điểm, nên lúc nào cũng nói được ca này do rule nào quyết.</small></li>
   <li><b>Ghi ca.</b> Lớp 1-2 có thể ghép vào ca có sẵn. Gặp edge case thì vẫn ghi phương án tốt nhất, gắn mã T và đánh dấu gán tạm. Mỗi khách đi qua tối đa 4 vòng cho đủ số buổi.</li>
   <li><b>Rà cuối.</b> Lớp 1-2 vẫn lẻ thì ghi T5. Khoảng trống trong ngày dài hơn 2 ca mà ngắn hơn mức HLV khai thì ghi G5.<small>G5 chỉ kiểm cuối vì một khoảng trống có thể được lấp bởi ca xếp sau.</small></li>
  </ol></section>

function autoPlace(){
  const before=SESS.reduce((a,s)=>a+s.bk.length,0);
  RUN.unp=[];RUN.cut={};NOSWAP=state.status==='published';
  const list=unplaced();
  const flex=Object.fromEntries(list.map(c=>[c.id,options(c).cands.length]));
  const byFlex=(a,b)=>flex[a.id]-flex[b.id]||CL.indexOf(a)-CL.indexOf(b);
  const A=list.filter(c=>on('U1')&&c.pref).sort(byFlex),B=list.filter(c=>!(on('U1')&&c.pref)).sort(byFlex);
  rounds(A);rounds(B);finalize();
  if(state.status==='published')SESS.forEach(s=>s.bk.forEach(b=>{if(b.fresh===undefined)b.fresh=true}));
  state.rulesDirty=false;
  return SESS.reduce((a,s)=>a+s.bk.length,0)-before;
}
function startRun(){SESS=[];SID=1;OFFD=new Set(PTS.filter(p=>p.off).map(p=>p.off));resetWeek();const n=autoPlace();WK.may=snap();state.status='draft';return n}
// Ghi một thay đổi: tính lệch chỉ số trước/sau, đánh số bản nếu đã chốt.
function change(entry,fn){
  const before=metNow();fn();finalize();
  const after=metNow(),deltas={};MET.forEach(m=>{if(before[m.id]!==after[m.id])deltas[m.id]=(after[m.id]??0)-(before[m.id]??0)});
  if(WK.locked)WK.ver++;
  WK.log.push({ver:WK.locked?WK.ver:null,phase:WK.locked?'tuan':'chot',deltas,...entry});
}
function removeBk(s,cid){s.bk=s.bk.filter(b=>b.c!==cid);if(!s.bk.length)SESS=SESS.filter(x=>x!==s)}
// Phương án cho 1 khách (dời từ ca s0, hoặc xếp mới khi s0 rỗng). Xếp hạng theo đúng bộ rule đang dùng.
function placeOptions(c,s0,av,keepPT){
  if(s0)return moveOptions(c,s0,av,keepPT).map(x=>({...x,outside:!c.av.has(K(x.d,x.h))}));
  const out=[];
  for(const key of av){const[d,h]=key.split('|').map(Number);for(const p of PTS){const r=check(c,d,h,p,{av});if(r.ok)out.push({d,h,p,join:r.join})}}
  const vals=UORD.filter(id=>id!=='U1'&&on(id)).map(id=>VAL[id](c)).filter(Boolean),pref=on('U1')&&c.pref;
  out.forEach(x=>{x.key=[pref&&x.p.id===c.pref?1:0,...vals.map(v=>v(x))];x.tags=optTags(c,x,null);x.outside=!c.av.has(K(x.d,x.h))});
  const cmp=(a,b)=>{for(let i=0;i<a.length;i++)if(a[i]!==b[i])return b[i]-a[i];return 0};
  return out.sort((a,b)=>cmp(a.key,b.key)||a.d-b.d||a.h-b.h||PTS.indexOf(a.p)-PTS.indexOf(b.p));
}
// Khách đang chờ có thể vào ghế trống của lớp nhóm s

const ovKindOk=k=>state.ov.kind==='all'||state.ov.kind===k;

const dutyAt=(p,d,t,k)=>p.submitted&&p.kinds.includes(k)&&p.av.has(K(d,t))&&!OFFD.has(p.id+'|'+d)&&(!p.avk.get(K(d,t))||p.avk.get(K(d,t)).includes(k));

  const sameSlot=SESS.some(s=>s.d===d&&Math.abs(s.h-h)<DUR&&s.bk.some(b=>b.c===c.id));
  return({N1:`HLV ${p.short} không dạy ${c.kind}`,N2:'Khách không chọn giờ này trong form',
    N3:p.submitted?(OFFD.has(p.id+'|'+d)?`HLV ${p.short} báo nghỉ ngày này`:`Ngoài khung trực của HLV ${p.short} (hoặc khung chỉ dạy môn khác)`):`HLV ${p.short} chưa nộp khung trực`,
    N4:sameSlot?`${c.short} đã có buổi chồng giờ này`:r.blocker?`HLV ${p.short} đang có lớp ${r.blocker.cls} khác giờ này${r.blocker.cls===c.cls&&r.blocker.bk.length>=CAP[c.cls]?' (đã đủ ghế)':''}`:`HLV ${p.short} có lớp chồng giờ`,
    G1:`${c.short} đã có buổi trong ngày (rule Khách 1 buổi/ngày)`,G2:`HLV ${p.short} đã đủ ${p.dayMax} giờ dạy trong ngày`,G3:`HLV ${p.short} đã chạm trần ca tháng`,

// HLV nghỉ ngày d: với từng lớp bị ảnh hưởng, tìm HLV khác cùng giờ nhận được cả lớp. Lớp sau tính trên lựa chọn của lớp trước.
function planOff(m){
  const p=PB[m.pid],aff=SESS.filter(s=>s.p===p.id&&s.d===m.d).sort((a,b)=>a.h-b.h);
  const prev=m.aff&&m.affDay===m.d?m.aff:null;m.affDay=m.d;
  const orig=aff.map(s=>s.p),key=p.id+'|'+m.d,had=OFFD.has(key);OFFD.add(key);
  m.aff=aff.map((s,i)=>{
    const opts=PTS.filter(q=>q!==p&&s.bk.every(b=>{const r=check(CB[b.c],s.d,s.h,q,{ignore:s.id});return r.ok&&!r.join}))
      .sort((a,b)=>(b.fit.includes(s.cls)-a.fit.includes(s.cls))||((a.ct==='oc')-(b.ct==='oc'))||ratio(a)-ratio(b));
    let pick=prev&&prev[i]?prev[i].pick:0;if(pick>=opts.length)pick=opts.length?0:-1;
    if(pick>=0)s.p=opts[pick].id;
    return{sid:s.id,opts,pick};
  });
  aff.forEach((s,i)=>s.p=orig[i]);if(!had)OFFD.delete(key);
}
function notifyOff(m){const out=new Set([`HLV ${PB[m.pid].short}`]);m.aff.forEach(a=>{const s=SESS.find(x=>x.id===a.sid);s.bk.forEach(b=>out.add(CB[b.c].name));if(a.pick>=0)out.add('HLV '+a.opts[a.pick].short)});return[...out]}
function mGo(){
  const m=state.modal,pub=state.status==='published';
  if(m.type==='move'||m.type==='find'){
    const o=m.opts[m.pick];if(!o)return;const c=CB[m.cid];
    if(m.sid){const s=SESS.find(x=>x.id===m.sid),from={d:s.d,h:s.h,p:s.p},reason=$('#m_reason').value;let ns;
      change({type:'doi',c:c.id,from,to:{d:o.d,h:o.h,p:o.p.id},reason},()=>{removeBk(s,c.id);ns=book(c,o,{rule:'CS',ok:true,cs:{reason,phase:pub?'tuan':'chot'},confirm:o.outside,fresh:pub})});
      if(pub)CHANGES.push({text:`Đổi ${c.name}: ${slotS(from.d,from.h)} → ${slotS(o.d,o.h)}, HLV ${o.p.short}`,at:nowAt(),notify:[...new Set([c.name,'HLV '+PB[from.p].short,'HLV '+o.p.short])]});
      state.sel={t:'s',id:ns.id};state.day=o.d;toast('Đã đổi chỗ. Các lớp khác giữ nguyên.')}
    else{let ns;change({type:'them',c:c.id,from:null,to:{d:o.d,h:o.h,p:o.p.id},reason:'CS xếp tay'},()=>{ns=book(c,o,{rule:'CS',ok:true,cs:{reason:'CS xếp tay',phase:pub?'tuan':'chot'},confirm:o.outside,fresh:pub})});
      if(pub)CHANGES.push({text:`Xếp thêm ${c.name}: ${slotS(o.d,o.h)}, HLV ${o.p.short}`,at:nowAt(),notify:[c.name,'HLV '+o.p.short]});
      state.sel={t:'s',id:ns.id};state.day=o.d;toast(`Đã xếp ${c.name} vào ${slotS(o.d,o.h)}.`)}
  }
  if(m.type==='kchange'){
    const s=SESS.find(x=>x.id===m.sid),c=CB[m.cid],p=PB[s.p],ch=CHARGE.find(x=>x[0]===m.when);
    const charged=m.first?false:ch[3]===null?m.chg:ch[3],reason=$('#m_reason').value.trim()||'không nói',from={d:s.d,h:s.h,p:s.p};
    const chTxt=charged?`tính buổi, HLV ${p.short} vẫn có comm`:'không tính buổi';
    if(m.mode==='cancel'){
      change({type:m.when==='noshow'?'vang':'huy',c:c.id,from,to:null,reason:m.when==='noshow'?'Vắng không báo':'Khách yêu cầu',why:reason,charged},()=>removeBk(s,c.id));
      const left=SESS.find(x=>x.id===s.id),under=left&&left.cls==='1-4'&&left.bk.length<MINRUN['1-4'];
      CHANGES.push({text:`${c.name} ${m.when==='noshow'?'vắng':'huỷ'} ${slotS(from.d,from.h)} (${reason}): ${chTxt}${m.first?' (huỷ lần đầu gói mới)':''}.${left?` Lớp còn ${left.bk.length}/${CAP[left.cls]} ghế.`:` HLV ${p.short} trống giờ này.`}${under?' Lớp dưới sĩ số tối thiểu, CS quyết giữ hay huỷ.':''}`,at:nowAt(),notify:['HLV '+p.short]});
      state.sel=left?{t:'s',id:left.id}:null;toast(`Đã ghi: ${chTxt}.${under?' Lớp 1-4 dưới sĩ số tối thiểu.':''}`)}
    else{const o=m.opts[m.pick];if(!o)return;let ns;
      change({type:'doi',c:c.id,from,to:{d:o.d,h:o.h,p:o.p.id},reason:'Khách yêu cầu',why:reason,charged},()=>{removeBk(s,c.id);ns=book(c,o,{rule:'CS',ok:true,cs:{reason:'Khách yêu cầu',phase:'tuan'},confirm:o.outside,fresh:true})});
      CHANGES.push({text:`${c.name} đổi ${slotS(from.d,from.h)} → ${slotS(o.d,o.h)}, HLV ${o.p.short} (${reason}). Buổi cũ: ${chTxt}.`,at:nowAt(),notify:[...new Set(['HLV '+p.short,'HLV '+o.p.short])]});
      state.sel={t:'s',id:ns.id};state.day=o.d;toast('Đã đổi lịch, chỉ buổi này thay đổi.')}
  }
  if(m.type==='ptoff'){
    const p=PB[m.pid],notify=notifyOff(m);let moved=0,dropped=0;
    m.aff.forEach(a=>{const s=SESS.find(x=>x.id===a.sid);
      if(a.pick<0){change({type:'ptoff',c:s.bk[0].c,from:{d:s.d,h:s.h,p:s.p},to:null,reason:'HLV xin đổi'},()=>{SESS=SESS.filter(x=>x!==s)});dropped++;return}
      const q=a.opts[a.pick];change({type:'ptoff',c:s.bk[0].c,from:{d:s.d,h:s.h,p:s.p},to:{d:s.d,h:s.h,p:q.id},reason:'HLV xin đổi'},()=>{s.p=q.id;s.bk.forEach(b=>{b.flags=b.flags.filter(f=>f.code!=='HD');b.flags.push({code:'HD',text:`HLV ${p.short} nghỉ ${DOWF[m.d]}, chuyển sang HLV ${q.short} cùng giờ.`,down:false})})});moved++});
    OFFD.add(p.id+'|'+m.d);setWin(p,p.win.filter(w=>w.d!==m.d));
    const txt=`HLV ${p.short} nghỉ ${DOWF[m.d]} ${dm(m.d)}: chuyển ${moved} lớp${dropped?`, ${dropped} lớp chờ gọi khách`:''}.`;
    if(pub)CHANGES.push({text:txt,at:nowAt(),notify});
    state.sel=null;state.day=m.d;toast(txt);
  }
  if(m.type==='restart'){const n=startRun();state.sel=null;toast(`Đã xếp lại ${n} buổi.`)}
  if(m.type==='publish'){state.status='published';WK.chot=snap();WK.locked=true;WK.ver=1;NOSWAP=true;state.sel=null;toast(`Đã gửi lịch v1 cho ${new Set(allBk().map(x=>x.b.c)).size} khách và ${new Set(SESS.map(s=>s.p)).size} HLV (demo).`)}
  closeModal();render();
}

const BANDS=[['Sáng sớm 6–9h',360,540],['Trưa 11–14h',660,840],['Chiều tối 17–21h',1020,1200]];
function pgGrid(av,p){
  return `<div class="qk" style="margin:0 0 8px">${BANDS.map(([l,a,b],i)=>`<button class="btn line xs" data-act="${p}-band" data-v="${i}">${l}</button>`).join('')}</div>

  ${START.map(t=>`<button class="hr ${t%60?'hh':''}" data-act="${p}-hr" data-v="${t}">${t%60?':30':t/60+'h'}</button>${DAYS.map((x,d)=>`<button class="c ${av.has(K(d,t))?'on':''}" data-act="${p}-cell" data-v="${K(d,t)}" aria-label="${DOWF[d]} ${hm(t)}"></button>`).join('')}`).join('')}</div>`}
function toggle(set,keys){const all=keys.every(k=>set.has(k));keys.forEach(k=>all?set.delete(k):set.add(k))}
const gridAct=(set,kind,v)=>{
  if(kind==='cell')toggle(set,[v]);
  if(kind==='day')toggle(set,START.map(t=>K(+v,t)));
  if(kind==='hr')toggle(set,DAYS.map((x,d)=>K(d,+v)));
  if(kind==='band'){const[,a,b]=BANDS[+v];toggle(set,DAYS.flatMap((x,d)=>START.filter(t=>t>=a&&t+DUR<=b).map(t=>K(d,t))))}
};

  const added=allBk().filter(({s,b})=>!before.has([b.c,s.d,s.h,s.p].join('|')));

  if(pub&&n)CHANGES.push({text:`Xếp thêm ${n} buổi cho khách gửi trễ hoặc HLV nộp trễ.`,at:nowAt(),notify:[...new Set(added.map(x=>CB[x.b.c].name))]});

  toast(n?`Đã xếp thêm ${n} buổi, các lớp đã có giữ nguyên.`:'Không xếp thêm được buổi nào.');

document.addEventListener('click',e=>{
  // các nút dùng lại từ máy v2 (tab Bộ rule, Chỉ số, Đọc thread CS)
  const v2=e.target.closest('[data-tg],[data-up],[data-dn],[data-reset],[data-met],[data-thrread],[data-thrsample],[data-thrclear],[data-thrcopy]');
  if(v2&&!v2.disabled){const d=v2.dataset;
    if(d.tg){CFG[d.tg].on=!CFG[d.tg].on;state.rulesDirty=state.status!=='empty'}
    else if(d.up||d.dn){const id=d.up||d.dn,i=UORD.indexOf(id),j=i+(d.up?-1:1);if(j>=1&&j<UORD.length){[UORD[i],UORD[j]]=[UORD[j],UORD[i]];state.rulesDirty=state.status!=='empty'}}
    else if('reset' in d){defaultCfg();state.rulesDirty=state.status!=='empty'}
    else if(d.met)state.met=state.met===d.met?null:d.met;
    else if('thrread' in d){state.thr.text=$('#thr-in').value;saveThr(state.thr.text)}
    else if('thrsample' in d)state.thr.text=THR_SAMPLE;
    else if('thrclear' in d){state.thr.text='';saveThr('')}
    else if('thrcopy' in d){navigator.clipboard?.writeText(state.thrTsv).then(()=>{v2.textContent='Đã chép'},()=>{v2.textContent='Không chép được'});return}
    render();return}
  const t=e.target.closest('[data-act]');if(!t){if(e.target.id==='modal')closeModal();return}
  const a=t.dataset.act,v=t.dataset.v,id=t.dataset.id,m=state.modal;
  if(t.tagName==='SELECT'||t.tagName==='INPUT'||t.disabled)return;
  switch(a){
    case 'role':state.role=v;state.sel=null;break;
    case 'theme':{const r=document.documentElement,dk=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=dk?'light':'dark';break}
    case 'reset':boot();closeModal();toast('Đã làm lại demo từ đầu.');break;
    case 'tab':state.tab=v;state.sel=null;break;
    case 'view':state.view=v;break;
    case 'day':state.day=+v;break;
    case 'goday':state.day=+v;state.view='day';break;
    case 'sel-s':state.sel={t:'s',id:+id};{const s=SESS.find(x=>x.id===+id);if(s&&state.view==='day')state.day=s.d}if(state.tab!=='plan')state.tab='plan';break;
    case 'sel-p':state.sel={t:'p',id};break;
    case 'sel-c':state.sel={t:'c',id};if(!['plan','ov'].includes(state.tab))state.tab='plan';break;
    case 'ov-mode':state.ov.mode=v;break;
    case 'ov-kind':state.ov.kind=v;state.sel=state.sel?.t==='slot'?{...state.sel,cid:null}:state.sel;break;
    case 'ov-need':state.ov.need=!state.ov.need;break;
    case 'slot':state.sel={t:'slot',d:+t.dataset.d,h:+t.dataset.h,cid:null};break;
    case 'slot-c':state.sel={...state.sel,cid:id};break;
    case 'man':{const c=CB[state.sel.cid],p=PB[id],sl=state.sel,r=check(c,sl.d,sl.h,p),ov=v==='ovr',pub=state.status==='published';
      const why='CS xếp tay'+(ov?` (bỏ qua rule "${RB[r.no].name}")`:'');
      change({type:'them',c:c.id,from:null,to:{d:sl.d,h:sl.h,p:p.id},reason:'CS xếp tay'},()=>book(c,{d:sl.d,h:sl.h,p,join:r.join||null},{rule:'CS',ok:true,cs:{reason:why,phase:pub?'tuan':'chot'},fresh:pub,override:ov?r.no:null}));
      if(state.status==='empty')state.status='draft';
      if(pub)CHANGES.push({text:`Xếp thêm ${c.name}: ${slotS(sl.d,sl.h)}, HLV ${p.short}${ov?` (bỏ qua ${RB[r.no].name})`:''}.`,at:nowAt(),notify:[c.name,'HLV '+p.short]});
      state.sel={...sl,cid:null};toast(`Đã xếp ${c.name} với HLV ${p.short} lúc ${slotS(sl.d,sl.h)}.`);break}
    case 'close':state.sel=null;break;
    case 'auto':{if(state.status==='empty'){const n=startRun();toast(`Đã xếp ${n} buổi.`)}else fillMissing();break}
    case 'restart':openModal({type:'restart'});return;
    case 'go-rules':state.runMode=state.status==='published'?'fill':v;state.tab='rules';state.sel=null;break;
    case 'run-mode':state.runMode=v;break;
    case 'run-rules':{const pub=state.status==='published',mode=pub?'fill':(state.runMode||(SESS.length?'fill':'fresh'));
      if(mode==='fresh'||!SESS.length){const n=startRun(),up=unplaced().reduce((x,c)=>x+need(c),0),tmp=allBk().filter(x=>isTmp(x.b)).length;
        toast(`Đã xếp ${n} buổi${tmp?`, ${tmp} buổi gán tạm chờ cậu chốt`:''}${up?`, còn ${up} buổi chưa xếp được`:''}.`)}
      else fillMissing();
      Object.assign(state,{tab:'plan',view:'week',sel:null,runMode:null});break}
    case 'adv':state.adv=!state.adv;if(!state.adv&&[...NAV_ADV.map(x=>x[0])].includes(state.tab))state.tab='plan';if(!state.adv&&state.role==='lab')state.role='cs';break;
    case 'publish':openModal({type:'publish'});return;
    case 'okbk':{const s=SESS.find(x=>x.id===+id),b=s.bk.find(x=>x.c===v);b.ok=true;toast('Đã chốt phương án máy cho buổi này.');break}
    case 'fill':{const s=SESS.find(x=>x.id===+id),c=CB[v];change({type:'them',c:c.id,from:null,to:{d:s.d,h:s.h,p:s.p},reason:'CS lấp ghế trống'},()=>book(c,{d:s.d,h:s.h,p:PB[s.p],join:s},{rule:'CS',ok:true,cs:{reason:'CS lấp ghế trống',phase:state.status==='published'?'tuan':'chot'},fresh:state.status==='published'}));
      if(state.status==='published')CHANGES.push({text:`Xếp ${c.name} vào ghế trống ${slotS(s.d,s.h)}, HLV ${PB[s.p].short}.`,at:nowAt(),notify:[c.name,'HLV '+PB[s.p].short]});toast(`Đã xếp ${c.name} vào lớp.`);break}
    case 'find':openModal({type:'find',cid:id,pick:0,wide:false});return;
    case 'move':openModal({type:'move',sid:+id,cid:v,pick:0,wide:false});return;
    case 'drop':{const s=SESS.find(x=>x.id===+id);change({type:'bo',c:v,from:{d:s.d,h:s.h,p:s.p},to:null,reason:'CS thấy hợp hơn'},()=>removeBk(s,v));state.sel={t:'c',id:v};toast('Đã bỏ khách khỏi lớp trong bản nháp.');break}
    case 'kchange':openModal({type:'kchange',sid:+id,cid:v,mode:'cancel',when:'far',chg:null,first:false,pick:0});return;
    case 'ptoff':openModal({type:'ptoff',pid:id,d:null});return;
    case 'nudge':toast(`Đã nhắc ${v} qua Zalo (demo, chưa gửi thật).`);return;
    case 'copy':navigator.clipboard?.writeText('https://'+(v||'fitforlife.vn/lich-tap/tuan-41')).catch(()=>{});toast('Đã sao chép link form.');return;
    case 'told':CHANGES[+v].told=true;break;
    // modal
    case 'close-m':closeModal();return;
    case 'm-go':mGo();return;
    case 'm-pick':m.pick=+v;drawModal();return;
    case 'm-wide':m.wide=v==='1';m.pick=0;drawModal();return;
    case 'm-mode':m.mode=v;m.pick=0;if(v==='move'&&m.when==='noshow')m.when='far';m.reason=$('#m_reason')?.value;drawModal();return;
    case 'm-when':m.when=v;m.chg=null;m.reason=$('#m_reason')?.value;drawModal();return;
    case 'm-chg':m.chg=v==='1';m.reason=$('#m_reason')?.value;drawModal();return;
    case 'm-av':{const tx=$('#m_av').value.trim();m.avTxt=tx;m.reason=$('#m_reason')?.value;try{m.av=tx?[...parseWin(tx).starts]:null;m.avErr=null}catch(err){m.avErr=err}m.pick=0;drawModal();return}
    case 'm-apick':m.aff[+t.dataset.i].pick=+v;planOff(m);drawModal();return;
    // form khách
    case 'f-n':state.form.n=+v;break;
    case 'f-keep':state.form.keep=v;break;
    case 'f-cell':case 'f-day':case 'f-hr':case 'f-band':gridAct(state.form.av,a.slice(2),v);break;
    case 'kh-send':{const f=state.form,c=CB[f.cid];f.note=$('#f_note').value.trim();const av=f.keep==='keep'&&c.last?toAv(c.last):new Set(f.av);
      Object.assign(c,{n:f.n,av,pref:f.pref||null,note:f.note,req:true,viaForm:true,at:'Vừa gửi'});f.sent=true;
      toast('Đã gửi. Bên CS thấy ở bước 1 (Gửi form) và lưới Tổng hợp; xếp bổ sung ở bước 2 hoặc 3.');break}
    case 'kh-edit':state.form.sent=false;break;
    // HLV
    case 'pd-st':{const x=state.ptForm.days[+t.dataset.i];x.st=v;if(v==='on'&&!x.win.length)x.win.push({a:1020,b:1260,kind:null});break}
    case 'pw-add':{const x=state.ptForm.days[+t.dataset.i];const last=x.win[x.win.length-1];x.win.push(last?{a:Math.min(last.b+60,1200),b:Math.min(last.b+240,1290),kind:last.kind}:{a:360,b:600,kind:null});break}
    case 'pw-del':state.ptForm.days[+t.dataset.i].win.splice(+v,1);break;
    case 'pt-gap':state.ptForm.gap=+v;break;
    case 'pt-prev':{const p=PB[state.ptForm.pid],src=p.submitted?p.win:parseWin(p.prev).win;state.ptForm.days=DAYS.map((x,d)=>({st:src.some(w=>w.d===d)?'on':'off',win:src.filter(w=>w.d===d).map(w=>({...w}))}));break}
    case 'pt-clear':state.ptForm.days=DAYS.map(()=>({st:'off',win:[]}));break;
    case 'pt-send':{const p=PB[state.ptForm.pid],f=state.ptForm,win=f.days.flatMap((x,d)=>x.st==='on'?x.win.filter(w=>w.b>w.a).map(w=>({d,a:w.a,b:w.b,kind:w.kind||null})):[]);
      setWin(p,win);p.gapMin=f.gap;p.submitted=true;p.at='Vừa nộp';f.sent=true;
      const lost=SESS.filter(s=>s.p===p.id&&!p.av.has(K(s.d,s.h)));
      toast(lost.length?`Đã nộp. ${lost.length} lớp đã xếp rơi ngoài khung mới, CS cần xử lý.`:'Đã nộp khung trực. CS có thể bấm "Xếp phần còn thiếu".');break}
    case 'pt-edit':state.ptForm.sent=false;break;
    // chạy thử
    case 'lab-team':{const L=lab();L.pts=v==='def'?labTeam():v==='few'?[labPT({...DEF_PTS[0]}),labPT({...DEF_PTS[1],ct:'pt'})]:[];break}
    case 'la-ct':lab().pts[+t.dataset.i].ct=v;break;
    case 'la-kind':lab().pts[+t.dataset.i].kinds=v==='both'?['Gym','Pilates']:[v];break;
    case 'la-fit':{const p=lab().pts[+t.dataset.i];p.fit=p.fit.includes(v)?p.fit.filter(x=>x!==v):[...p.fit,v].sort();break}
    case 'la-del':lab().pts.splice(+t.dataset.i,1);break;
    case 'la-add':{const L=lab();L.pts.push(labPT({name:'HLV mới '+(L.pts.length+1),ct:'pt',kinds:['Pilates'],fit:['1-1'],av:PRESETS[0][2]}));break}
    case 'la-edit':{const i=+t.dataset.i;openModal({type:'labav',i,txt:lab().pts[i].av});return}
    case 'lv-save':{const p=lab().pts[m.i],tx=$('#lv_txt').value.trim();try{parseWin(tx,p.kinds);p.av=tx;p.preset=presetOf(tx);closeModal()}catch(err){m.txt=tx;m.err=err;drawModal();return}break}
    case 'lm-kind':{const f=lab().form;f.kind=v;f.pref='';break}
    case 'lm-cls':{const f=lab().form;f.cls=v;f.pref='';break}
    case 'lm-n':lab().form.n=+v;break;
    case 'lm-cell':case 'lm-day':case 'lm-hr':case 'lm-band':gridAct(lab().form.av,a.slice(3),v);break;
    case 'lm-add':{const L=lab(),f=L.form,name=f.name.trim()||'Khách '+(L.mine.length+1);
      L.mine.push({name,kind:f.kind,cls:f.cls,n:f.n,av:new Set(f.av),pref:f.pref||null});L.form=labForm(f.kind,f.cls,f.n);
      toast(`Đã thêm ${name}. Thêm khách khác, hoặc bấm "Xếp ca".`);break}
    case 'lm-del':lab().mine.splice(+t.dataset.i,1);break;
    case 'lab-sample':lab().nSample=+v;break;
    case 'lab-go':applyLab();break;
  }
  render();
});
document.addEventListener('change',e=>{
  const a=e.target.dataset.act,i=+e.target.dataset.i,j=+e.target.dataset.j;
  if(a==='khme'){state.khMe=e.target.value;state.form=null;render()}
  if(a==='ptme'){state.ptMe=e.target.value;state.ptForm=null;render()}
  if(a==='f-pref'){state.form.pref=e.target.value}
  if(a==='lm-pref'){lab().form.pref=e.target.value}
  if(a==='pw-a'||a==='pw-b'){const w=state.ptForm.days[i].win[j];w[a==='pw-a'?'a':'b']=+e.target.value;if(w.b<=w.a)w.b=Math.min(w.a+60,LAST+DUR+30);render()}
  if(a==='pw-k'){state.ptForm.days[i].win[j].kind=e.target.value||null;render()}
  if(a==='m-first'){state.modal.first=e.target.checked;state.modal.reason=$('#m_reason')?.value;drawModal()}
  if(a==='la-preset'){const p=lab().pts[i],v=e.target.value;
    if(v==='custom'){render();openModal({type:'labav',i,txt:p.av})}else{p.preset=v;p.av=PRESETS.find(x=>x[0]===v)[2];render()}}
  if(a==='m-day'){state.modal.d=+e.target.value;state.modal.aff=null;drawModal()}
  const k=e.target.dataset.thrrule;if(k){const vv=parseFloat(e.target.value);if(!isNaN(vv)){state.thr.rule[k]=vv;state.thr.text=$('#thr-in').value;render()}}
});
document.addEventListener('input',e=>{if(e.target.id==='f_note'&&state.form)state.form.note=e.target.value;
  const a=e.target.dataset.act;if(a==='la-name')lab().pts[+e.target.dataset.i].name=e.target.value;if(a==='lm-name')lab().form.name=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)closeModal();else if(state.sel){state.sel=null;render()}}});

defaultCfg();boot();
if(typeof window!=='undefined'&&!window.__TEST__)render();

</script>
